<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ody Store — أودي ستور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#F1EADA;
    --cream2:#E9E1CC;
    --navy:#132C2A;
    --navy2:#1B3937;
    --orange:#CE4E2B;
    --orange-d:#B8431F;
    --yellow:#F1BA1E;
    --ink:#1C1B16;
    --muted:#6E6B5C;
    --line:rgba(28,27,22,0.14);
    --line-navy:rgba(241,234,218,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--cream); color:var(--ink); font-family:'Cairo',sans-serif;}
  body{min-height:100vh;}
  h1,h2,h3,h4{font-weight:900; line-height:1.15;}
  p{line-height:1.85; color:var(--muted);}
  a{color:inherit; text-decoration:none;}
  button{font-family:'Cairo',sans-serif; cursor:pointer;}
  img{max-width:100%; display:block;}
  .wrap{max-width:760px; margin:0 auto; padding:0 22px;}

  /* header */
  header{position:sticky; top:0; z-index:60; background:rgba(241,234,218,0.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); box-shadow:0 2px 12px rgba(28,27,22,.04);}
  .nav-wrap{max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 22px;}
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;}
  .brand .box{width:38px; height:38px; background:var(--orange); color:var(--cream); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; border-radius:9px; flex-shrink:0;}
  .brand .name{font-size:18px; font-weight:900; letter-spacing:.3px;}
  .brand .name b{color:var(--orange);}
  .icon-btns{display:flex; gap:8px;}
  .icon-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:none; display:flex; align-items:center; justify-content:center; position:relative; font-size:17px; transition:background .15s, border-color .15s, transform .1s;}
  .icon-btn:hover{background:var(--cream2); border-color:var(--orange);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn .dot{position:absolute; top:-3px; left:-3px; background:var(--orange); color:#fff; font-size:10px; width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900;}

  .menu-panel{max-width:760px; margin:0 auto; padding:0 22px; overflow:hidden; max-height:0; transition:max-height .25s ease;}
  .menu-panel.open{max-height:260px;}
  .menu-panel .inner{display:flex; flex-direction:column; gap:2px; padding:10px 0 18px;}
  .menu-panel button{background:none; border:none; text-align:right; padding:11px 6px; font-size:15px; font-weight:700; color:var(--ink); border-radius:6px;}
  .menu-panel button.active{color:var(--orange);}
  .menu-panel button:hover{background:var(--cream2);}

  /* pill */
  .pill{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:30px; padding:10px 20px; font-size:13px; font-weight:700; letter-spacing:.3px;}
  .pill.dark{background:var(--navy); color:var(--cream); border:none;}
  .pill.dark:hover{background:var(--navy2);}
  .pill.ghost:hover{background:rgba(28,27,22,.05);}

  /* hero */
  .hero{padding:46px 0 10px;}
  .eyebrow{display:flex; align-items:center; gap:10px; font-size:12px; letter-spacing:2px; color:var(--orange); font-weight:800; margin-bottom:22px;}
  .eyebrow .dash{width:26px; height:2px; background:var(--orange);}
  .hero h1{font-size:56px; letter-spacing:-1px;}
  .hero h1 .l1{color:var(--navy); display:block;}
  .hero h1 .l2{color:var(--orange); display:block;}
  .hero p.lead{font-size:16px; margin:22px 0 26px; max-width:480px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:44px;}

  /* marquee */
  .marquee{background:var(--yellow); overflow:hidden; white-space:nowrap; padding:13px 0; margin-bottom:46px;}
  .marquee-track{display:inline-block; animation:scroll 18s linear infinite; font-weight:800; font-size:13px; letter-spacing:1px; color:var(--ink);}
  .marquee-track span{margin:0 22px;}
  @keyframes scroll{0%{transform:translateX(0);} 100%{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){.marquee-track{animation:none;}}

  /* section titles */
  .sec-title{margin-bottom:26px;}
  .sec-title h3{font-size:30px; color:var(--navy);}

  /* product grid */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding-bottom:50px;}
  @media(min-width:640px){ .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px;} }
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .card:hover{border-color:var(--orange); transform:translateY(-3px); box-shadow:0 10px 24px rgba(28,27,22,.09);}
  .card .imgwrap{aspect-ratio:1/1; background:var(--cream2); position:relative; overflow:hidden;}
  .card .imgwrap img{width:100%; height:100%; object-fit:cover; cursor:zoom-in; transition:transform .3s ease;}
  .card:hover .imgwrap img{transform:scale(1.04);}
  .card .imgwrap .noimg{display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:12px;}
  .lightbox{position:fixed; inset:0; background:rgba(20,18,15,.92); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:12px;}
  .lightbox .lb-close{position:absolute; top:18px; left:18px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:20px;}
  .card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card h4{font-size:16px; color:var(--ink);}
  .card .desc{color:var(--muted); font-size:12.5px; line-height:1.6; flex:1;}
  .sizes{display:flex; gap:6px; flex-wrap:wrap;}
  .size-opt{border:1px solid var(--line); padding:4px 10px; font-size:11.5px; border-radius:20px; color:var(--muted); cursor:pointer;}
  .size-opt.sel{border-color:var(--orange); color:var(--orange); background:rgba(206,78,43,.06);}
  .add-btn{margin-top:6px; background:var(--navy); color:var(--cream); border:none; padding:11px; font-weight:800; font-size:13.5px; border-radius:10px;}
  .add-btn:hover{background:var(--orange);}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px; background:#fff; border:1px dashed var(--line); border-radius:18px;}

  /* footer dark band */
  .band{background:var(--navy); color:var(--cream); border-radius:26px 26px 0 0; padding:44px 22px 34px; margin-top:10px;}
  .band .inner{max-width:760px; margin:0 auto;}
  .band h2{font-size:34px; margin-bottom:14px;}
  .band p{color:rgba(241,234,218,.65); font-size:14.5px; max-width:420px; margin-bottom:26px;}
  .band .links{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; font-weight:700; border-top:1px solid var(--line-navy); padding-top:20px;}
  .band .links button{background:none; border:none; color:rgba(241,234,218,.8);}
  .band .links button:hover{color:var(--yellow);}
  .copyright{text-align:center; padding:16px; font-size:11.5px; color:var(--muted);}

  /* generic panel */
  .panel{max-width:420px; margin:50px auto; background:#fff; border:1px solid var(--line); border-radius:22px; padding:34px 28px;}
  .panel.wide{max-width:660px;}
  .panel .brandmark{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:22px;}
  .panel .brandmark .box{width:34px; height:34px; background:var(--orange); color:#fff; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px;}
  .panel h2{font-size:24px; text-align:center; color:var(--navy);}
  .panel .sub{color:var(--muted); font-size:13.5px; text-align:center; margin:6px 0 26px;}
  .field{margin-bottom:15px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:700;}
  .field input, .field textarea, .field select{width:100%; background:var(--cream2); border:1.5px solid transparent; color:var(--ink); padding:12px 14px; font-family:'Cairo',sans-serif; font-size:14px; border-radius:12px; transition:border-color .15s, background .15s;}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--orange); background:#fff;}
  .btn-main{width:100%; background:var(--orange); color:#fff; border:none; padding:14px; font-weight:800; font-size:15px; border-radius:14px; margin-top:6px; transition:background .15s, transform .1s, box-shadow .15s; box-shadow:0 4px 14px rgba(206,78,43,.28);}
  .btn-main:hover{background:var(--orange-d);}
  .btn-ghost{width:100%; background:none; border:1px solid var(--line); color:var(--ink); padding:12px; font-weight:700; font-size:13.5px; border-radius:14px; margin-top:10px;}
  .switch-link{text-align:center; margin-top:18px; font-size:13px; color:var(--muted);}
  .switch-link button{background:none; border:none; color:var(--orange); font-weight:800; font-size:13px;}
  .error-msg{background:rgba(206,78,43,.08); border:1px solid var(--orange); color:var(--orange-d); padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:16px;}
  .ok-msg{background:rgba(241,186,30,.15); border:1px solid var(--yellow); color:#7a5c00; padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:16px;}

  /* cart */
  .cart-item{display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding:14px 0;}
  .cart-item .thumb{width:54px; height:54px; background:var(--cream2); border-radius:10px; flex-shrink:0; overflow:hidden;}
  .cart-item .thumb img{width:100%; height:100%; object-fit:cover;}
  .cart-item .info{flex:1;}
  .cart-item .info h4{font-size:14px; margin-bottom:2px; font-weight:800;}
  .cart-item .info span{font-size:12px; color:var(--muted);}
  .cart-item .price{font-weight:800; font-size:14px; color:var(--orange);}
  .cart-item .rm{background:none; border:none; color:var(--muted); font-size:18px; padding:4px 8px;}
  .total-row{display:flex; justify-content:space-between; padding:16px 0 6px; font-weight:900; font-size:17px; color:var(--navy);}

  /* admin */
  .admin-topbar{display:flex; justify-content:space-between; align-items:center; margin:30px 0 20px;}
  .admin-topbar h2{font-size:22px; color:var(--navy);}
  .tabs{display:flex; gap:6px; margin-bottom:24px; border-bottom:1px solid var(--line);}
  .tabs button{background:none; border:none; color:var(--muted); padding:10px 16px; font-weight:700; font-size:14px; border-bottom:2px solid transparent;}
  .tabs button.active{color:var(--orange); border-color:var(--orange);}
  .admin-grid{display:grid; grid-template-columns:1fr; gap:20px;}
  @media (min-width:820px){.admin-grid{grid-template-columns:1.1fr 1.4fr;}}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:right; padding:10px 8px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:700; font-size:12px;}
  .row-img{width:36px; height:36px; object-fit:cover; background:var(--cream2); border-radius:8px;}
  .mini-btn{background:none; border:1px solid var(--line); color:var(--ink); padding:5px 10px; font-size:12px; border-radius:8px;}
  .mini-btn.danger{color:var(--orange-d); border-color:var(--orange);}
  .mini-btn.edit{color:#7a5c00; border-color:var(--yellow);}
  .order-card{border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; background:#fff;}
  .order-card .head{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .order-card .items{font-size:13px; line-height:1.8; color:var(--ink);}
  .status-pill{font-size:11px; padding:3px 10px; border-radius:20px; font-weight:800;}
  .status-جديد{background:rgba(241,186,30,.2); color:#7a5c00;}
  .status-تم-التجهيز{background:rgba(206,78,43,.12); color:var(--orange-d);}
  .status-تم-التسليم{background:rgba(19,44,42,.1); color:var(--navy);}
  .file-drop{border:1.5px dashed var(--line); border-radius:14px; padding:16px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer;}
  .loading{text-align:center; padding:80px 20px; color:var(--muted);}
  .spinner{width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--orange); border-radius:50%; margin:0 auto 16px; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
  .cut{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:6px 0 18px;}
  .cut::before, .cut::after{content:''; flex:1; border-top:1px dashed var(--line);}
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <div class="brand" id="logo-secret">
      <div class="box">O</div>
      <div class="name">Ody <b>Store</b></div>
    </div>
    <div class="icon-btns">
      <button class="icon-btn" id="cart-icon-btn">🛍
        <span class="dot hidden" id="cart-count">0</span>
      </button>
      <button class="icon-btn" id="menu-toggle">☰</button>
    </div>
  </div>
  <div class="menu-panel" id="menu-panel">
    <div class="inner">
      <button data-view="shop">المتجر</button>
      <button data-view="login" id="nav-login">تسجيل الدخول</button>
      <button data-view="cart">السلة</button>
    </div>
  </div>
</header>

<div id="app"></div>

<div class="copyright">Ody Store — كل الحقوق محفوظة © 2026</div>

<script>
/* ============ STATE ============ */
const state = {
  view: 'shop',
  session: null,
  products: [],
  orders: [],
  reviews: [],
  currentProduct: null,
  cart: [],
  selectedSizes: {},
  authMode: 'login',
  editingProduct: null,
  adminTab: 'products'
};

/* الإيميل الوحيد المسموح له بدخول لوحة التحكم */
const ADMIN_EMAIL = 'yahiayy2000@gmail.com';

/* ============ SUPABASE ============ */
const SUPABASE_URL = 'https://zpeonmredkjxbhjrdtec.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_AsQe1XhyU8_lMP9Q8jwivQ_1rUzlfjh';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* دالة تحويل الطلب لتفتح واتساب الزبون مباشرة وآمن تماماً */
function sendWhatsAppOrder(order) {
  const phone = '201559937937';
  let text = `طلب جديد من المتجر 🛍️%0Aرقم الطلب: ${order.id}%0Aالعميل: ${order.userName}%0Aالموبايل: ${order.phone}%0Aالعنوان: ${order.address}%0A%0Aالمنتجات:%0A`;
  order.items.forEach(item => {
    text += `- ${item.name} (${item.size}) × ${item.qty} = ${item.price * item.qty} ج.م%0A`;
  });
  text += `%0Aالإجمالي: ${order.total} ج.م`;
  const url = `https://wa.me/${phone}?text=${text}`;
  window.open(url, '_blank');
}

function productFromRow(r){
  return { id:r.id, name:r.name, price:r.price, desc:r.description||'', sizes:r.sizes||[], img:r.img||'', images:r.images||[], stock:r.stock ?? 0 };
}
function orderFromRow(r){
  return { id:r.id, userEmail:r.user_email, userName:r.user_name, items:r.items||[], total:r.total, phone:r.phone, address:r.address, date:r.order_date, status:r.status };
}
function reviewFromRow(r){
  return { id:r.id, productId:r.product_id, userEmail:r.user_email, userName:r.user_name, rating:r.rating, comment:r.comment||'', date:r.created_at };
}
function ratingStats(productId){
  const rs = state.reviews.filter(r=>r.productId===productId);
  if(rs.length===0) return { avg:0, count:0 };
  const avg = rs.reduce((s,r)=>s+r.rating,0) / rs.length;
  return { avg, count: rs.length };
}
function starsHtml(avg, size){
  size = size || 14;
  let html = '';
  for(let i=1;i<=5;i++){
    const filled = i <= Math.round(avg);
    html += `<span style="font-size:${size}px; color:${filled?'#f5a623':'#d8d2c4'}">★</span>`;
  }
  return html;
}

/* ============ STORAGE ============ */
async function loadAll(){
  try{
    const { data } = await sb.from('products').select('*').order('created_at', { ascending:true });
    state.products = (data||[]).map(productFromRow);
  }catch(e){ state.products = []; }

  try{
    const { data } = await sb.from('orders').select('*').order('order_date', { ascending:true });
    state.orders = (data||[]).map(orderFromRow);
  }catch(e){ state.orders = []; }

  try{
    const { data } = await sb.from('reviews').select('*').order('created_at', { ascending:false });
    state.reviews = (data||[]).map(reviewFromRow);
  }catch(e){ state.reviews = []; }
}

/* ============ NAV ============ */
document.querySelectorAll('.menu-panel button[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.view = btn.dataset.view;
    if(state.view==='login' && state.session){ state.view='account'; }
    document.getElementById('menu-panel').classList.remove('open');
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });
});
document.getElementById('menu-toggle').addEventListener('click', ()=>{
  document.getElementById('menu-panel').classList.toggle('open');
});
document.getElementById('cart-icon-btn').addEventListener('click', ()=>{ setView('cart'); });

/* الضغط على اللوجو 5 مرات يفتح صفحة الأدمن المحمية */
let logoClicks = 0;
let logoClickTimer = null;
document.getElementById('logo-secret').addEventListener('click', ()=>{
  logoClicks++;
  clearTimeout(logoClickTimer);
  logoClickTimer = setTimeout(()=>{ logoClicks = 0; }, 2500);
  if(logoClicks >= 5){
    logoClicks = 0;
    clearTimeout(logoClickTimer);
    setView('admin');
  }
});

function setView(v){ state.view=v; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ============ RENDER ROOT ============ */
function render(){
  updateNav();
  const app = document.getElementById('app');
  if(state.view==='shop') app.innerHTML = renderShop();
  else if(state.view==='product') app.innerHTML = renderProductPage();
  else if(state.view==='login') app.innerHTML = renderAuth();
  else if(state.view==='account') app.innerHTML = renderAccount();
  else if(state.view==='cart') app.innerHTML = renderCart();
  else if(state.view==='admin') app.innerHTML = renderAdminGate();
  bindViewEvents();
}
function updateNav(){
  document.querySelectorAll('.menu-panel button[data-view]').forEach(b=>b.classList.remove('active'));
  const key = state.view==='account' ? 'login' : state.view;
  const active = document.querySelector(`.menu-panel button[data-view="${key}"]`);
  if(active) active.classList.add('active');
  document.getElementById('nav-login').textContent = state.session ? ('أهلاً ' + state.session.name.split(' ')[0]) : 'تسجيل الدخول';
  const count = state.cart.reduce((s,i)=>s+i.qty,0);
  const cc = document.getElementById('cart-count');
  if(count>0){ cc.textContent = count; cc.classList.remove('hidden'); } else cc.classList.add('hidden');
}

/* ============ SHOP ============ */
function renderShop(){
  const items = state.products.map(p=>{
    const out = (p.stock??0) <= 0;
    const rs = ratingStats(p.id);
    return `
    <div class="card" data-open="${p.id}" style="cursor:pointer;">
      <div class="imgwrap">
        ${p.img ? `<img src="${p.img}" alt="${escapeHtml(p.name)}">` : `<div class="noimg">لا توجد صورة</div>`}
        ${out ? `<div style="position:absolute; top:10px; right:10px; background:#333; color:#fff; font-size:11px; padding:3px 8px; border-radius:6px;">نفذت الكمية</div>` : ''}
      </div>
      <div class="body" style="padding:10px 12px;">
        <h4 style="margin-bottom:4px; font-size:13.5px;">${escapeHtml(p.name)}</h4>
        ${rs.count>0 ? `<div style="display:flex; align-items:center; gap:5px; margin-bottom:6px;">${starsHtml(rs.avg,12)}<span style="font-size:11px; color:var(--muted);">(${rs.count})</span></div>` : ''}
        <div style="font-weight:800; color:var(--orange); font-size:13.5px;">${p.price} ج.م</div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="wrap">
    <div class="hero">
      <div class="eyebrow"><span class="dash"></span>تيشرتات رجالي مصرية</div>
      <h1><span class="l1">Ody</span><span class="l2">Store</span></h1>
      <p class="lead">قطع بسيطة، خامة تستحمل، وسعر منطقي. من غير ضجة.</p>
      <div class="btn-row">
        <a href="#collection" class="pill dark">تسوق دلوقتي</a>
      </div>
    </div>
  </div>

  <div class="marquee"><div class="marquee-track">
    <span>شحن سريع</span><span>•</span><span>دفع عند الاستلام</span><span>•</span><span>جودة عالية</span><span>•</span>
    <span>شحن سريع</span><span>•</span><span>دفع عند الاستلام</span><span>•</span><span>جودة عالية</span><span>•</span>
  </div></div>

  <div class="wrap" id="collection">

function renderProductPage(){
  const p = state.products.find(x=>x.id===state.currentProduct);
  if(!p){ state.view='shop'; return renderShop(); }
  const sel = state.selectedSizes[p.id] || (p.sizes[0]||'');
  const out = (p.stock??0) <= 0;
  const rs = ratingStats(p.id);
  const myReviews = state.reviews.filter(r=>r.productId===p.id);
  const canReview = !!state.session;
  const gallery = (p.images && p.images.length) ? p.images : (p.img ? [p.img] : []);
  const activeIdx = state.productImgIdx || 0;
  const mainImg = gallery[activeIdx] || gallery[0] || '';

  const reviewsHtml = myReviews.length ? myReviews.map(r=>`
      <div style="border-bottom:1px solid var(--line); padding:14px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b style="font-size:13.5px;">${escapeHtml(r.userName)}</b>
          <div>${starsHtml(r.rating,13)}</div>
        </div>
        ${r.comment ? `<div style="font-size:13px; color:var(--muted); margin-top:6px;">${escapeHtml(r.comment)}</div>` : ''}
      </div>`).join('') : `<div style="color:var(--muted); font-size:13.5px; padding:10px 0;">لسه محدش قيّم المنتج ده</div>`;

  return `
  <div class="wrap">
    <button class="btn-ghost" data-view="shop" style="margin-bottom:16px;">→ رجوع للمتجر</button>
    <div class="panel" style="padding:0; overflow:hidden;">
      <div class="imgwrap" style="aspect-ratio:1/1;">
        ${mainImg ? `<img src="${mainImg}" alt="${escapeHtml(p.name)}" style="width:100%; height:100%; object-fit:cover;">` : `<div class="noimg">لا توجد صورة</div>`}
      </div>
      <div style="padding:20px;">
        <h2 style="margin-bottom:4px;">${escapeHtml(p.name)}</h2>
        <div style="font-size:22px; font-weight:800; color:var(--orange); margin-bottom:14px;">${p.price} ج.م</div>
        <div style="color:var(--muted); font-size:14px; margin-bottom:18px;">${escapeHtml(p.desc||'')}</div>
        <label style="font-size:13px; font-weight:700; display:block; margin-bottom:8px;">اختار المقاس</label>
        <div class="sizes" data-pid="${p.id}" style="margin-bottom:18px;">
          ${p.sizes.map(s=>`<div class="size-opt ${s===sel?'sel':''}" data-size="${s}">${s}</div>`).join('')}
        </div>
        ${out ? `<button class="btn-main" disabled style="opacity:.5;">نفذت الكمية</button>` : `<button class="btn-main" data-add="${p.id}">ضيفه للسلة</button>`}
      </div>
    </div>
  </div>`;
}

function renderAccount(){
  const myOrders = state.orders.filter(o=>o.userEmail===state.session.email).slice().reverse();
  return `
  <div class="panel wide">
    <h2>أهلاً ${escapeHtml(state.session.name)} 👋</h2>
    <div class="sub">${escapeHtml(state.session.email)}</div>

    ${myOrders.length ? myOrders.map(o=>orderCardHtml(o,false)).join('') : `<div class="empty">لسه معملتش أي طلب</div>`}

  </div>`;

function bindAuthEvents(){
  const to = (m)=>{ state.authMode=m; render(); };
  document.getElementById('to-register')?.addEventListener('click', ()=>to('register'));
  document.getElementById('to-login')?.addEventListener('click', ()=>to('login'));
  
  document.getElementById('do-register')?.addEventListener('click', async ()=>{
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim().toLowerCase();
    const pass = document.getElementById('reg-pass').value;
    const err = document.getElementById('auth-err');
    if(!name||!email||!pass){ err.innerHTML=`<div class="error-msg">املأ كل الحقول</div>`; return; }
    const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
    if(error){ err.innerHTML=`<div class="error-msg">حصل خطأ، حاول تاني</div>`; return; }
    err.innerHTML = `<div class="ok-msg">تم التسجيل بنجاح! تأكد من إيميلك أو سجل دخولك الآن.</div>`;
  });

  document.getElementById('do-login')?.addEventListener('click', async ()=>{
    const email = document.getElementById('log-email').value.trim().toLowerCase();
    const pass = document.getElementById('log-pass').value;
    const err = document.getElementById('auth-err');
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ err.innerHTML=`<div class="error-msg">بيانات الدخول غلط</div>`; return; }
    const u = data.user;
    state.session = { name: u.user_metadata?.name || email.split('@')[0], email: u.email };
    state.view='shop';
    render();
  });

  document.getElementById('logout-btn')?.addEventListener('click', async ()=>{
    await sb.auth.signOut();
    state.session=null; state.view='shop'; render();
  });
}

/* ============ CART / CHECKOUT ============ */
function renderCart(){
  if(state.cart.length===0){
    return `<div class="wrap"><div class="empty">السلة فاضية.. روح شوف الكولكشن</div>
    <div style="text-align:center; margin-top:10px;"><button class="btn-ghost" style="max-width:220px; display:inline-block;" onclick="setView('shop')">للمتجر</button></div></div>`;
  }
  const total = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const itemsHtml = state.cart.map((c,idx)=>`
    <div class="cart-item">
      <div class="thumb">${c.img?`<img src="${c.img}">`:''}</div>
      <div class="info"><h4>${escapeHtml(c.name)}</h4><span>مقاس ${c.size} × ${c.qty}</span></div>
      <div class="price">${c.price*c.qty} ج.م</div>
      <button class="rm" data-rm="${idx}">✕</button>
    </div>`).join('');

  const needAuth = !state.session;
  return `
  <div class="panel wide">
    <h2>السلة</h2>
    ${itemsHtml}
    <div class="total-row"><span>الإجمالي</span><span>${total} ج.م</span></div>
    ${needAuth ? `<div class="error-msg">لازم تسجل دخول الأول عشان تكمل الطلب</div>
      <button class="btn-main" onclick="setView('login')">تسجيل الدخول</button>`
      : `
      <div class="cut">✂ بيانات التسليم</div>
      <div class="field"><label>رقم الموبايل</label><input id="ord-phone" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label>العنوان بالتفصيل</label><textarea id="ord-address" rows="3" placeholder="المحافظة، المنطقة"></textarea></div>
      <div id="ord-err"></div>
      <button class="btn-main" id="confirm-order">تأكيد الطلب وإرساله عبر واتساب</button>`}
  </div>`;
}

function bindCartEvents(){
  document.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.cart.splice(parseInt(btn.dataset.rm),1);
      render();
    });
  });
  
  document.getElementById('confirm-order')?.addEventListener('click', async ()=>{
    const phone = document.getElementById('ord-phone').value.trim();
    const address = document.getElementById('ord-address').value.trim();
    const err = document.getElementById('ord-err');
    if(!phone || !address){ err.innerHTML = `<div class="error-msg">اكتب رقم الموبايل والعنوان</div>`; return; }
    
    const total = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
    const order = {
      id: 'YG-' + Date.now().toString().slice(-6),
      userEmail: state.session.email,
      userName: state.session.name,
      items: state.cart.map(c=>({productId:c.productId, name:c.name, price:c.price, size:c.size, qty:c.qty})),
      total, phone, address,
      date: new Date().toISOString(),
      status: 'جديد'
    };

    // حفظ الطلب في قاعدة البيانات Supabase
    await sb.from('orders').insert({
      id: order.id, user_email: order.userEmail, user_name: order.userName,
      items: order.items, total: order.total, phone: order.phone,
      address: order.address, order_date: order.date, status: order.status
    });

    state.orders.push(order);
    state.cart = [];
    state.lastOrder = order;
    
    // فتح الواتساب فوراً للعميل بالطلب
    sendWhatsAppOrder(order);
    setView('shop');
  });
}

function orderCardHtml(o, showAdmin){
  const statusClass = 'status-' + o.status.replace(/\s+/g,'-');
  return `
  <div class="order-card">
    <div class="head">
      <span>#${o.id} — ${new Date(o.date).toLocaleDateString('ar-EG')}</span>
      <span class="status-pill ${statusClass}">${o.status}</span>
    </div>
    ${showAdmin ? `<div style="font-size:13px; margin-bottom:6px; color:var(--muted)">${escapeHtml(o.userName)} — ${escapeHtml(o.phone)}<br>${escapeHtml(o.address)}</div>`:''}
    <div class="items">${o.items.map(it=>`${escapeHtml(it.name)} (${it.size}) × ${it.qty} — ${it.price*it.qty} ج.م`).join('<br>')}</div>
    <div style="text-align:left; margin-top:8px; font-weight:800; color:var(--orange-d)">الإجمالي: ${o.total} ج.م</div>
    ${showAdmin ? `<div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
      ${['جديد','تم التجهيز','تم التسليم'].map(s=>`<button class="mini-btn ${s===o.status?'edit':''}" data-status="${o.id}|${s}">${s}</button>`).join('')}
    </div>`:''}
  </div>`;
}

  <div class="admin-grid">

      <h2 style="font-size:18px">${editing? 'تعديل منتج':'إضافة منتج جديد'}</h2>

      <div class="field"><label>رابط الصورة</label><input id="p-img" value="${editing?escapeAttr(editing.img):''}" placeholder="https://..."></div>
      <button class="btn-main" id="save-prod">${editing?'حفظ التعديل':'إضافة المنتج'}</button>

      <table>

        ${state.products.map(p=>`
          <tr>
            <td>${p.img?`<img class="row-img" src="${p.img}">`:'—'}</td>

            <td>${p.price} ج.م</td>
            <td>${p.stock??0}</td>
            <td style="display:flex; gap:6px;">
              <button class="mini-btn edit" data-edit="${p.id}">تعديل</button>
              <button class="mini-btn danger" data-del="${p.id}">حذف</button>
            </td>
          </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;">مفيش منتجات</td></tr>`}

function renderAdminOrders(){
  const sorted = state.orders.slice().reverse();
  return `<div style="max-width:640px;">
    ${sorted.length ? sorted.map(o=>orderCardHtml(o,true)).join('') : `<div class="empty">لسه مفيش طلبات</div>`}
  </div>`;
}

function bindAdminEvents(){
  document.getElementById('adm-login-btn')?.addEventListener('click', async ()=>{
    const email = document.getElementById('adm-email').value.trim().toLowerCase();
    const pass = document.getElementById('adm-pass').value;
    const err = document.getElementById('admin-err');

    if(email !== ADMIN_EMAIL){
      err.innerHTML = `<div class="error-msg">هذا الإيميل ليس له صلاحية الأدمن!</div>`;
      return;
    }

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){
      err.innerHTML = `<div class="error-msg">كلمة المرور غير صحيحة</div>`;
      return;
    }
    state.session = { name: 'عدي', email: data.user.email };
    render();
  });

  document.getElementById('admin-logout')?.addEventListener('click', ()=>{
    state.editingProduct=null;
    state.view = 'shop';
    render();
  });

  document.querySelectorAll('.tabs [data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.adminTab = btn.dataset.tab; render(); });
  });

  document.getElementById('save-prod')?.addEventListener('click', async ()=>{
    const name = document.getElementById('p-name').value.trim();
    const price = parseFloat(document.getElementById('p-price').value);
    const desc = document.getElementById('p-desc').value.trim();
    const sizes = document.getElementById('p-sizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    const stock = parseInt(document.getElementById('p-stock').value) || 0;
    const img = document.getElementById('p-img').value.trim();
    const err = document.getElementById('prod-err');
    
    if(!name || !price){ err.innerHTML = `<div class="error-msg">املأ الاسم والسعر حداقل</div>`; return; }

    if(state.editingProduct){
      const p = state.products.find(x=>x.id===state.editingProduct.id);
      await sb.from('products').update({ name, price, description: desc, sizes, stock, img }).eq('id', p.id);
      p.name=name; p.price=price; p.desc=desc; p.sizes=sizes; p.stock=stock; p.img=img;
      state.editingProduct = null;
    } else {
      const newP = { id: 'p' + Date.now(), name, price, desc, sizes, stock, img };
      await sb.from('products').insert({
        id: newP.id, name: newP.name, price: newP.price, description: newP.desc,
        sizes: newP.sizes, stock: newP.stock, img: newP.img
      });
      state.products.push(newP);
    }
    render();
  });

  document.getElementById('cancel-edit')?.addEventListener('click', ()=>{
    state.editingProduct = null; render();
  });

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editingProduct = state.products.find(p=>p.id===btn.dataset.edit);
      render();
    });
  });

  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('متأكد؟')) return;
      await sb.from('products').delete().eq('id', btn.dataset.del);
      state.products = state.products.filter(p=>p.id!==btn.dataset.del);
      render();
    });
  });

  document.querySelectorAll('[data-status]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const [id, status] = btn.dataset.status.split('|');
      await sb.from('orders').update({ status }).eq('id', id);
      const o = state.orders.find(x=>x.id===id);
      if(o){ o.status = status; render(); }
    });
  });
}

function bindProductPageEvents(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.currentProduct = el.dataset.open;
      setView('product');
    });
  });
  document.querySelectorAll('.sizes .size-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pid = el.parentElement.dataset.pid;
      state.selectedSizes[pid] = el.dataset.size;
      render();
    });
  });
  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = state.products.find(x=>x.id===btn.dataset.add);
      if(!p) return;
      const size = state.selectedSizes[p.id] || p.sizes[0] || 'One Size';
      const existing = state.cart.find(c=>c.productId===p.id && c.size===size);
      if(existing) existing.qty++;
      else state.cart.push({productId:p.id, name:p.name, price:p.price, size, qty:1, img:p.img});
      updateNav();
      btn.textContent = 'اتضاف ✓';
      setTimeout(()=>{ btn.textContent='ضيفه للسلة'; }, 900);
    });
  });
}

function bindShopEvents(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.currentProduct = el.dataset.open;
      setView('product');
    });
  });
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function bindViewEvents(){
  if(state.view==='shop') bindShopEvents();
  if(state.view==='product') bindProductPageEvents();
  if(state.view==='login' || state.view==='account') bindAuthEvents();
  if(state.view==='cart') bindCartEvents();
  if(state.view==='admin') bindAdminEvents();
}

/* ============ INIT ============ */
async function init(){
  document.getElementById('app').innerHTML = `<div class="loading"><div class="spinner"></div>بنجهزلك المتجر...</div>`;
  await loadAll();
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.session = { name: session.user.user_metadata?.name || session.user.email.split('@')[0], email: session.user.email };
  }
  render();
}
init();
</script>
