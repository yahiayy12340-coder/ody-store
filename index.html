<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ody Store — أودي ستور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#F1EADA;
    --cream2:#E9E1CC;
    --navy:#132C2A;
    --navy2:#1B3937;
    --orange:#CE4E2B;
    --orange-d:#B8431F;
    --yellow:#F1BA1E;
    --ink:#1C1B16;
    --muted:#6E6B5C;
    --line:rgba(28,27,22,0.14);
    --line-navy:rgba(241,234,218,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--cream); color:var(--ink); font-family:'Cairo',sans-serif;}
  body{min-height:100vh;}
  h1,h2,h3,h4{font-weight:900; line-height:1.15;}
  p{line-height:1.85; color:var(--muted);}
  a{color:inherit; text-decoration:none;}
  button{font-family:'Cairo',sans-serif; cursor:pointer;}
  img{max-width:100%; display:block;}
  .wrap{max-width:760px; margin:0 auto; padding:0 22px;}

  /* header */
  header{position:sticky; top:0; z-index:60; background:rgba(241,234,218,0.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); box-shadow:0 2px 12px rgba(28,27,22,.04);}
  .nav-wrap{max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 22px;}
  .brand{display:flex; align-items:center; gap:0; cursor:pointer; user-select:none;}
  .brand .box{display:none!important;}
  .brand .name{font-size:18px; font-weight:900; letter-spacing:.3px;}
  .brand .name b{color:var(--orange);}
  .icon-btns{display:flex; gap:8px;}
  .icon-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:none; display:flex; align-items:center; justify-content:center; position:relative; font-size:17px; transition:background .15s, border-color .15s, transform .1s;}
  .icon-btn:hover{background:var(--cream2); border-color:var(--orange);}
  .support-icon{color:#168c5b!important; text-decoration:none!important;}
  .support-icon:hover{background:rgba(22,140,91,.08)!important; border-color:#168c5b!important;}
  .menu-support{display:block; margin-top:6px; padding:11px 10px; border:1px solid var(--line); border-radius:10px; color:#168c5b; font-weight:800; text-decoration:none; text-align:right;}
  .menu-support:hover{background:rgba(22,140,91,.07);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn .dot{position:absolute; top:-3px; left:-3px; background:var(--orange); color:#fff; font-size:10px; width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900;}

  .menu-panel{max-width:760px; margin:0 auto; padding:0 22px; overflow:hidden; max-height:0; transition:max-height .25s ease;}
  .menu-panel.open{max-height:330px;}
  .menu-panel .inner{display:flex; flex-direction:column; gap:2px; padding:10px 0 18px;}
  .menu-panel button{background:none; border:none; text-align:right; padding:11px 6px; font-size:15px; font-weight:700; color:var(--ink); border-radius:6px;}
  .menu-panel button.active{color:var(--orange);}
  .menu-panel button:hover{background:var(--cream2);}

  /* pill */
  .pill{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:30px; padding:10px 20px; font-size:13px; font-weight:700; letter-spacing:.3px;}
  .pill.dark{background:var(--navy); color:var(--cream); border:none;}
  .pill.dark:hover{background:var(--navy2);}
  .pill.ghost:hover{background:rgba(28,27,22,.05);}

  /* hero */
  .hero{padding:46px 0 10px;}
  .eyebrow{display:flex; align-items:center; gap:10px; font-size:12px; letter-spacing:2px; color:var(--orange); font-weight:800; margin-bottom:22px;}
  .eyebrow .dash{width:26px; height:2px; background:var(--orange);}
  .hero h1{font-size:56px; letter-spacing:-1px;}
  .hero h1 .l1{color:var(--navy); display:block;}
  .hero h1 .l2{color:var(--orange); display:block;}
  .hero p.lead{font-size:16px; margin:22px 0 26px; max-width:480px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:44px;}

  /* poster card */
  .poster{background:var(--orange); border-radius:26px; padding:30px 26px 40px; position:relative; overflow:hidden; margin-bottom:20px;}
  .poster::before{content:''; position:absolute; top:-60px; left:-60px; width:220px; height:220px; border:34px solid var(--yellow); border-radius:50%; opacity:.9;}
  .poster-top{display:flex; justify-content:space-between; font-size:11px; letter-spacing:2px; color:rgba(241,234,218,.8); font-weight:800; position:relative; z-index:2;}
  .poster h2{color:var(--cream); font-size:52px; line-height:0.98; margin:26px 0 18px; position:relative; z-index:2;}
  .poster h2 span{display:block;}
  .poster p{color:rgba(241,234,218,.85); font-size:15px; max-width:280px; position:relative; z-index:2;}
  .poster-bottom{display:flex; align-items:flex-end; justify-content:space-between; margin-top:34px; position:relative; z-index:2;}
  .rot-tag{border:1.5px solid rgba(241,234,218,.4); color:rgba(241,234,218,.75); font-size:11px; padding:14px 16px; transform:rotate(-8deg); letter-spacing:1px;}
  .sticker{background:var(--yellow); color:var(--ink); font-size:12px; font-weight:800; padding:9px 16px; border-radius:20px; transform:rotate(-3deg); position:absolute; bottom:-14px; right:20px; box-shadow:2px 3px 0 rgba(0,0,0,.15); z-index:3;}
  .circ-arrow{width:52px; height:52px; border-radius:50%; background:var(--yellow); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; flex-shrink:0;}

  /* marquee */
  .marquee{background:#fff; overflow:hidden; white-space:nowrap; padding:13px 0; margin-bottom:26px; border-top:1px solid #eee; border-bottom:1px solid #eee;}
  .marquee-track{display:flex; width:max-content; animation:scroll 22s linear infinite; font-weight:800; font-size:13px; letter-spacing:1px; color:#111; will-change:transform;}
  .marquee-group{display:flex; align-items:center; flex-shrink:0;}
  .marquee-track span{margin:0 22px; color:#111;}
  @keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){.marquee-track{animation:none;}}

  /* section titles */
  .sec-title{margin-bottom:26px;}
  .sec-title h3{font-size:30px; color:var(--navy);}

  /* product grid (reskinned) */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding-bottom:50px;}
  @media(min-width:640px){ .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px;} }
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .card:hover{border-color:var(--orange); transform:translateY(-3px); box-shadow:0 10px 24px rgba(28,27,22,.09);}
  .card:active{transform:translateY(-1px);}
  .card .imgwrap{aspect-ratio:1/1; background:var(--cream2); position:relative; overflow:hidden;}
  .card .imgwrap img{width:100%; height:100%; object-fit:cover; cursor:zoom-in; transition:transform .3s ease;}
  .card:hover .imgwrap img{transform:scale(1.04);}
  .card .imgwrap .noimg{display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:12px;}
  .lightbox{position:fixed; inset:0; background:rgba(20,18,15,.92); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:12px;}
  .lightbox .lb-close{position:absolute; top:18px; left:18px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:20px;}
  .price-tag{position:absolute; top:10px; left:10px; background:var(--navy); color:var(--cream); font-size:12px; font-weight:800; padding:5px 11px; border-radius:20px;}
  .card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card h4{font-size:16px; color:var(--ink);}
  .card .desc{color:var(--muted); font-size:12.5px; line-height:1.6; flex:1;}
  .sizes{display:flex; gap:6px; flex-wrap:wrap;}
  .size-opt{border:1px solid var(--line); padding:4px 10px; font-size:11.5px; border-radius:20px; color:var(--muted); cursor:pointer;}
  .size-opt.sel{border-color:var(--orange); color:var(--orange); background:rgba(206,78,43,.06);}
  .add-btn{margin-top:6px; background:var(--navy); color:var(--cream); border:none; padding:11px; font-weight:800; font-size:13.5px; border-radius:10px;}
  .add-btn:hover{background:var(--orange);}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px; background:#fff; border:1px dashed var(--line); border-radius:18px;}

  /* feature cards */
  .feat-row{display:flex; flex-direction:column; gap:14px; margin-bottom:50px;}
  .feat{border-radius:20px; padding:26px 24px;}
  .feat.dark{background:var(--navy); color:var(--cream);}
  .feat.dark p{color:rgba(241,234,218,.7);}
  .feat.outline{border:1.5px solid var(--line); background:#fff;}
  .feat .ico{font-size:22px; margin-bottom:16px; display:block;}
  .feat h4{font-size:19px; margin-bottom:8px;}
  .feat.dark h4{color:var(--cream);}

  /* quote */
  .quote-sec{padding:20px 0 50px;}
  .quote-sec blockquote{font-size:27px; font-weight:800; color:var(--navy); line-height:1.4; margin:18px 0 22px;}
  .quote-sec p.desc{font-size:15px; max-width:520px;}
  .byline{display:flex; align-items:center; gap:12px; margin-top:24px; font-size:12px; letter-spacing:1px; color:var(--muted); font-weight:700;}
  .byline .dash{width:30px; height:2px; background:var(--orange);}

  /* footer dark band */
  .band{background:var(--navy); color:var(--cream); border-radius:26px 26px 0 0; padding:44px 22px 34px; margin-top:10px;}
  .band .inner{max-width:760px; margin:0 auto;}
  .band h2{font-size:34px; margin-bottom:14px;}
  .band p{color:rgba(241,234,218,.65); font-size:14.5px; max-width:420px; margin-bottom:26px;}
  .band .links{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; font-weight:700; border-top:1px solid var(--line-navy); padding-top:20px;}
  .band .links button{background:none; border:none; color:rgba(241,234,218,.8);}
  .band .links button:hover{color:var(--yellow);}
  .copyright{text-align:center; padding:16px; font-size:11.5px; color:var(--muted);}

  /* generic panel (auth/cart/admin forms) */
  .panel{max-width:420px; margin:50px auto; background:#fff; border:1px solid var(--line); border-radius:22px; padding:34px 28px;}
  .panel.wide{max-width:660px;}
  .panel .brandmark{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:22px;}
  .panel .brandmark .box{width:34px; height:34px; background:var(--orange); color:#fff; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px;}
  .panel h2{font-size:24px; text-align:center; color:var(--navy);}
  .panel .sub{color:var(--muted); font-size:13.5px; text-align:center; margin:6px 0 26px;}
  .field{margin-bottom:15px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:700;}
  .field input, .field textarea, .field select{width:100%; background:var(--cream2); border:1.5px solid transparent; color:var(--ink); padding:12px 14px; font-family:'Cairo',sans-serif; font-size:14px; border-radius:12px; transition:border-color .15s, background .15s;}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--orange); background:#fff;}
  .btn-main{width:100%; background:var(--orange); color:#fff; border:none; padding:14px; font-weight:800; font-size:15px; border-radius:14px; margin-top:6px; transition:background .15s, transform .1s, box-shadow .15s; box-shadow:0 4px 14px rgba(206,78,43,.28);}
  .btn-main:hover{background:var(--orange-d); box-shadow:0 6px 18px rgba(206,78,43,.36);}
  .btn-main:active{transform:scale(.98);}
  .btn-main:disabled{box-shadow:none;}
  .btn-ghost{width:100%; background:none; border:1px solid var(--line); color:var(--ink); padding:12px; font-weight:700; font-size:13.5px; border-radius:14px; margin-top:10px; transition:background .15s, border-color .15s;}
  .btn-ghost:hover{background:var(--cream2); border-color:var(--muted);}
  .switch-link{text-align:center; margin-top:18px; font-size:13px; color:var(--muted);}
  .switch-link button{background:none; border:none; color:var(--orange); font-weight:800; font-size:13px;}
  .error-msg{background:rgba(206,78,43,.08); border:1px solid var(--orange); color:var(--orange-d); padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:16px;}
  .ok-msg{background:rgba(241,186,30,.15); border:1px solid var(--yellow); color:#7a5c00; padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:16px;}

  /* cart */
.cart-svg{width:22px;height:22px;display:block;color:currentColor;}
  #cart-icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;}
  body.dark-mode .cart-svg{color:#f5f5f5;}
  .cart-item{display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding:14px 0;}
  .cart-item .thumb{width:54px; height:54px; background:var(--cream2); border-radius:10px; flex-shrink:0; overflow:hidden;}
  .cart-item .thumb img{width:100%; height:100%; object-fit:cover;}
  .cart-item .info{flex:1;}
  .cart-item .info h4{font-size:14px; margin-bottom:2px; font-weight:800;}
  .cart-item .info span{font-size:12px; color:var(--muted);}
  .cart-item .price{font-weight:800; font-size:14px; color:var(--orange);}
  .cart-item .rm{background:none; border:none; color:var(--muted); font-size:18px; padding:4px 8px;}
  .cart-item .rm:hover{color:var(--orange);}
  .total-row{display:flex; justify-content:space-between; padding:16px 0 6px; font-weight:900; font-size:17px; color:var(--navy);}

  /* admin */
  .admin-topbar{display:flex; justify-content:space-between; align-items:center; margin:30px 0 20px;}
  .admin-topbar h2{font-size:22px; color:var(--navy);}
  .tabs{display:flex; gap:6px; margin-bottom:24px; border-bottom:1px solid var(--line);}
  .tabs button{background:none; border:none; color:var(--muted); padding:10px 16px; font-weight:700; font-size:14px; border-bottom:2px solid transparent;}
  .tabs button.active{color:var(--orange); border-color:var(--orange);}
  .admin-grid{display:grid; grid-template-columns:1fr; gap:20px;}
  @media (min-width:820px){.admin-grid{grid-template-columns:1.1fr 1.4fr;}}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:right; padding:10px 8px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:700; font-size:12px;}
  .row-img{width:36px; height:36px; object-fit:cover; background:var(--cream2); border-radius:8px;}
  .mini-btn{background:none; border:1px solid var(--line); color:var(--ink); padding:5px 10px; font-size:12px; border-radius:8px;}
  .mini-btn.danger{color:var(--orange-d); border-color:var(--orange);}
  .mini-btn.edit{color:#7a5c00; border-color:var(--yellow);}
  .order-card{border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; background:#fff;}
  .order-card .head{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .order-card .items{font-size:13px; line-height:1.8; color:var(--ink);}
  .status-pill{font-size:11px; padding:3px 10px; border-radius:20px; font-weight:800;}
  .status-جديد{background:rgba(241,186,30,.2); color:#7a5c00;}
  .status-تم-التجهيز{background:rgba(206,78,43,.12); color:var(--orange-d);}
  .status-تم-التسليم{background:rgba(19,44,42,.1); color:var(--navy);}

  .file-drop{border:1.5px dashed var(--line); border-radius:14px; padding:16px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer;}
  .file-drop:hover{border-color:var(--orange); color:var(--orange);}
  .preview-thumb{width:70px; height:70px; object-fit:cover; margin-top:10px; border:1px solid var(--line); border-radius:10px;}
  .loading{text-align:center; padding:80px 20px; color:var(--muted);}
  .spinner{width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--orange); border-radius:50%; margin:0 auto 16px; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.spinner{animation:none;}}
  .hidden{display:none !important;}
  .cut{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:6px 0 18px;}
  .cut::before, .cut::after{content:''; flex:1; border-top:1px dashed var(--line);}
  .admin-shortcut{display:none;}
  .admin-shortcut.show{display:flex;}
  .admin-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;}
  @media(min-width:640px){.admin-stats{grid-template-columns:repeat(4,1fr);}}
  .stat-action{border:0; font-family:inherit; text-align:inherit; cursor:pointer; width:100%;}
.stat-action:hover{transform:translateY(-1px);}
.stat-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 12px;}
  .stat-card .num{font-size:24px; font-weight:900; color:var(--navy); margin-top:4px;}
  .stat-card .lbl{font-size:11.5px; color:var(--muted); font-weight:700;}
  .admin-search{display:flex; gap:8px; margin-bottom:14px;}
  .admin-search input{flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-family:inherit;}
  .admin-search input:focus{outline:none; border-color:var(--orange);}
  .stock-low{color:var(--orange-d); font-weight:900;}
  .stock-ok{color:var(--navy); font-weight:800;}
  .admin-quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.admin-quick-actions .mini-btn{min-height:38px}.stat-action{border:1px solid var(--line);cursor:pointer;text-align:right;font-family:inherit}.stat-action:hover{border-color:var(--orange);transform:translateY(-1px)}
.admin-note{background:rgba(241,186,30,.12); border:1px solid rgba(241,186,30,.5); border-radius:12px; padding:11px 13px; font-size:12px; color:#7a5c00; margin-bottom:16px;}
</style>
<style id="ody-white-theme">
:root{--bg:#fff!important;--panel:#fff!important;--text:#171717!important;--muted:#6b7280!important;--line:#ececec!important;--orange:#111!important;--orange2:#333!important;--soft:#f7f7f7!important}
html,body{background:#fff!important;color:#171717!important}
body{font-family:Arial,"Tajawal","Noto Sans Arabic",sans-serif!important}
header,.header,.nav,.topbar{background:#fff!important;color:#171717!important;border-bottom:1px solid #eee!important;box-shadow:none!important}
.hero{background:#fff!important;color:#171717!important;border:0!important;box-shadow:none!important}
.hero .eyebrow,.hero .lead{color:#6b7280!important}
.hero h1 .l1,.hero h1 .l2{color:#111!important}
.card,.panel,.box,.product-card{background:#fff!important;color:#171717!important;border:1px solid #eee!important;box-shadow:0 4px 18px rgba(0,0,0,.045)!important}
.card:hover,.product-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)!important}
.btn,.pill,.btn-primary{background:#111!important;color:#fff!important;border-color:#111!important}
.btn:hover,.pill:hover,.btn-primary:hover{background:#2b2b2b!important}
.btn-ghost,.btn-secondary{background:#fff!important;color:#171717!important;border:1px solid #dedede!important}
.btn-ghost:hover,.btn-secondary:hover{background:#f7f7f7!important}
input,textarea,select{background:#fff!important;color:#171717!important;border:1px solid #dedede!important}
input:focus,textarea:focus,select:focus{border-color:#111!important;box-shadow:0 0 0 3px rgba(17,17,17,.07)!important;outline:none!important}
.marquee{background:#111!important;color:#fff!important}
.price,.total,.product-price{color:#111!important}
.imgwrap{background:#f8f8f8!important}
.sec-title{color:#171717!important}
.empty,.loading{background:#fff!important;color:#6b7280!important}
footer{background:#fafafa!important;color:#555!important;border-top:1px solid #eee!important}
.admin,.admin-tabs{background:#fff!important}
.badge{background:#f3f3f3!important;color:#333!important}
</style>

<style id="ody-professional-polish">
/* Professional white storefront polish */
body{letter-spacing:.01em}
.wrap{max-width:1180px!important}
header,.header,.topbar,.nav{position:sticky!important;top:0;z-index:50!important}
.card,.panel,.product-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease!important}
.card:hover,.product-card:hover{transform:translateY(-2px)!important;border-color:#ddd!important}
.hero{padding-top:48px!important;padding-bottom:48px!important}
.hero h1{letter-spacing:-.04em!important}
.btn,.pill,.btn-primary{border-radius:10px!important;font-weight:700!important}
.btn-ghost,.btn-secondary{border-radius:10px!important}
input,textarea,select{border-radius:10px!important}
.marquee{display:block!important;overflow:hidden!important;white-space:nowrap!important;border-radius:0!important;position:relative!important}
.marquee-track{display:inline-flex!important;min-width:max-content!important;gap:28px!important;animation:odyMarquee 20s linear infinite!important;will-change:transform!important}

/* تحويل صف من قاعدة البيانات لشكل المنتج اللي بيستخدمه الكود */
const PRODUCT_CATEGORIES = [
  {id:'all', name:'الكل'},
  {id:'tshirts', name:'تيشرتات'},
  {id:'pants', name:'بناطيل'},
  {id:'bags', name:'شنط'},

function inferCategory(name){
  const n = String(name||'').toLowerCase();
  if(n.includes('بنطل') || n.includes('pants') || n.includes('jeans')) return 'pants';
  if(n.includes('شنط') || n.includes('شنطة') || n.includes('bag')) return 'bags';
  if(n.includes('حذاء') || n.includes('جزمة') || n.includes('shoe') || n.includes('sneaker')) return 'shoes';
  if(n.includes('إكسس') || n.includes('اكسس') || n.includes('accessor')) return 'accessories';
  return 'tshirts';
}

function categoryName(id){
  return (PRODUCT_CATEGORIES.find(c=>c.id===id)||PRODUCT_CATEGORIES[0]).name;
}

function productFromRow(r){
  return {
    id:r.id,
    name:r.name,
    price:r.price,
    desc:r.description||'',
    sizes:r.sizes||[],
    img:r.img||'',
    images:r.images||[],
    stock:r.stock ?? 0,
    category:r.category || inferCategory(r.name)
  };
}
function orderFromRow(r){
  return { id:r.id, userEmail:r.user_email, userName:r.user_name, items:r.items||[], total:r.total, phone:r.phone, address:r.address, date:r.order_date, status:r.status };
}
function reviewFromRow(r){
  return { id:r.id, productId:r.product_id, userEmail:r.user_email, userName:r.user_name, rating:r.rating, comment:r.comment||'', date:r.created_at };
}
/* متوسط التقييم وعدد المراجعات لمنتج معيّن */
function ratingStats(productId){
  const rs = state.reviews.filter(r=>r.productId===productId);
  if(rs.length===0) return { avg:0, count:0 };
  const avg = rs.reduce((s,r)=>s+r.rating,0) / rs.length;
  return { avg, count: rs.length };
}
function starsHtml(avg, size){
  size = size || 14;
  let html = '';
  for(let i=1;i<=5;i++){
    const filled = i <= Math.round(avg);
    html += `<span style="font-size:${size}px; color:${filled?'#f5a623':'#d8d2c4'}">★</span>`;
  }
  return html;
}

  try{

      state.orders = (data||[]).map(orderFromRow);

  }catch(e){ console.error('load orders', e); state.orders = []; }

  try{
    const { data, error } = await sb.from('reviews').select('*').order('created_at', { ascending:false });
    if(error) throw error;
    state.reviews = (data||[]).map(reviewFromRow);
  }catch(e){ console.error('load reviews', e); state.reviews = []; }

  state.users = [];
}

function setView(v, options={}){
  const {history:useHistory=true, replace=false, scroll=true, force=false} = options;

  // الحساب الشخصي هو نفس مدخل تسجيل الدخول في القائمة، لكن بعد تسجيل الدخول
  // يجب فتح الملف الشخصي مباشرةً وعدم إعادة المستخدم لصفحة الدخول.
  if(v==='login' && state.session && !state.authRecovery){
    v='account';
  }

  if(v==='admin' && !isAdmin()){
    // لا نعرض بوابة المسؤول للزائر العادي. نوجّهه إلى تسجيل الدخول فقط.
    v='login';
    state.authMode='login';
  }

  // منع تسجيل نفس الصفحة مرتين عند وجود أكثر من مستمع للزر نفسه.
  if(state.view===v && useHistory && !replace && !force){
    if(scroll) window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  state.view=v;

  // نظام تنقّل حقيقي: كل صفحة داخل التطبيق تصبح خطوة في سجل المتصفح،
  // وبالتالي زر الرجوع في الهاتف يعمل مثل المواقع العادية.
  if(useHistory){
    const entry={ view:v, category:state.selectedCategory || 'all', product:state.currentProduct || null };
    if(replace) window.history.replaceState(entry, '', window.location.href);
    else window.history.pushState(entry, '', window.location.href);
  }

  render();
  if(scroll) window.scrollTo({top:0,behavior:'smooth'});
}

// دعم زر الرجوع/التقدّم في المتصفح والهاتف.
window.addEventListener('popstate', (event)=>{
  const entry=event.state;
  if(entry && entry.view){
    state.view=entry.view;
    if(entry.category) state.selectedCategory=entry.category;
    state.currentProduct=entry.product || null;
    render();
    window.scrollTo({top:0,behavior:'auto'});
  }else{
    // لو رجعنا إلى صفحة خارج سجل التطبيق، نعتبرها المتجر.
    state.view='shop';
    render();
    window.scrollTo({top:0,behavior:'auto'});
  }
});

  const p = state.products.find(x=>x.id===state.currentProduct);

  const myReviews = state.reviews.filter(r=>r.productId===p.id);
  const canReview = !!state.session;
  const gallery = (p.images && p.images.length) ? p.images : (p.img ? [p.img] : []);

    <button class="btn-ghost" data-view="shop" style="margin-bottom:16px;">→ رجوع للمتجر</button>

      ${gallery.length>1 ? `
        <div style="display:flex; gap:8px; padding:12px 16px 0; overflow-x:auto;">
          ${gallery.map((src,i)=>`<img src="${src}" data-thumb="${i}" style="width:56px; height:56px; object-fit:cover; border-radius:8px; flex-shrink:0; cursor:pointer; border:2px solid ${i===activeIdx?'var(--orange)':'transparent'};">`).join('')}
        </div>` : ''}
      <div style="padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <h2 style="margin-bottom:4px;">${escapeHtml(p.name)}</h2>
          <button class="fav-btn ${state.wishlist.includes(p.id)?'active':''}" data-fav="${p.id}" style="position:static;flex-shrink:0;">${state.wishlist.includes(p.id)?'♥':'♡'}</button>
        </div>
        <div id="rating-summary" style="display:flex; align-items:center; gap:6px; margin-bottom:10px; cursor:pointer; width:fit-content;">
          ${starsHtml(rs.avg,16)}
          <span style="font-size:13px; color:${rs.count>0?'var(--muted)':'var(--orange)'}; font-weight:${rs.count>0?'400':'700'}; text-decoration:underline; text-underline-offset:2px;">${rs.count>0 ? `(${rs.count} تقييم)` : 'قيم الآن'}</span>
        </div>
        <div style="font-size:22px; font-weight:800; color:var(--orange); margin-bottom:14px;">${p.price} ج.م</div>
        <div style="color:var(--muted); font-size:14px; margin-bottom:18px;">${escapeHtml(p.desc||'')}</div>

        <label style="font-size:13px; font-weight:700; display:block; margin-bottom:8px;">اختر المقاس</label>
        <div class="sizes" data-pid="${p.id}" style="margin-bottom:8px;">

        </div>
        <button class="size-guide" id="open-size-guide">📏 دليل المقاسات</button>

        ${out
          ? `<button class="btn-main" disabled style="opacity:.5;">نفذت الكمية</button>`
          : `<button class="btn-main" data-add="${p.id}">أضف إلى السلة</button>
             ${(p.stock??0) <= 3 ? `<div style="font-size:12px; color:var(--orange-d); text-align:center; margin-top:6px;">باقي ${p.stock} بس!</div>` : ''}`}
      </div>
    </div>

    <div class="sticky-cart" id="sticky-cart">
      <span style="font-size:12px;white-space:nowrap;">${p.price} ج.م</span>
      <button data-add="${p.id}">${out?'نفذت الكمية':'أضف إلى السلة'}</button>
    </div>

    <div class="panel" id="reviews-panel" style="margin-top:18px;">
      <div class="cut">✂ آراء وتقييمات (${rs.count})</div>

          <label style="font-size:13px; font-weight:700; display:block; margin-bottom:8px;">قيّم هذا المنتج</label>
          <div id="star-picker" style="display:flex; gap:6px; margin-bottom:10px; font-size:26px; cursor:pointer;">

          <div id="review-err"></div>
          <button class="btn-main" id="submit-review">إرسال التقييم</button>

      <div>${reviewsHtml}</div>
    </div>

    ${(()=>{
      const related = state.products.filter(x=>x.id!==p.id).slice(0,4);
      if(related.length===0) return '';
      return `
      <div style="margin-top:24px;">
        <div class="sec-title"><h3>منتجات قد تهمك</h3></div>
        <div class="grid">
          ${related.map(rp=>`
            <div class="card" data-open="${rp.id}" style="cursor:pointer;">
              <div class="imgwrap">
                ${rp.img ? `<img src="${rp.img}" alt="${escapeHtml(rp.name)}">` : `<div class="noimg">لا توجد صورة</div>`}
              </div>
              <div class="body" style="padding:10px 12px;">
                <h4 style="margin-bottom:4px; font-size:13.5px;">${escapeHtml(rp.name)}</h4>
                <div style="font-weight:800; color:var(--orange); font-size:13.5px;">${rp.price} ج.م</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
    })()}
  </div>`;
}

function bindProductPageEvents(){
  const p = state.products.find(x=>x.id===state.currentProduct);

  document.querySelectorAll('[data-fav]').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const id=btn.dataset.fav;
      if(state.wishlist.includes(id)) state.wishlist=state.wishlist.filter(x=>x!==id);
      else state.wishlist=[...state.wishlist,id];
      localStorage.setItem('ody_wishlist',JSON.stringify(state.wishlist));
      showToast(state.wishlist.includes(id) ? 'تمت إضافة المنتج إلى المفضلة ❤️' : 'تمت إزالة المنتج من المفضلة');
      render();
    });
  });
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.currentProduct = el.dataset.open;
      state.productImgIdx = 0;
      state.recentlyViewed = [el.dataset.open, ...state.recentlyViewed.filter(x=>x!==el.dataset.open)].slice(0,8);
      localStorage.setItem('ody_recent', JSON.stringify(state.recentlyViewed));
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
  document.querySelectorAll('[data-thumb]').forEach(t=>{
    t.addEventListener('click', ()=>{
      state.productImgIdx = parseInt(t.dataset.thumb);
      render();
    });
  });
  document.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ setView(btn.dataset.view); });
  });
  document.getElementById('open-size-guide')?.addEventListener('click',()=>{
    const modal=document.createElement('div');
    modal.className='size-modal-backdrop';
    modal.innerHTML=`<div class="size-modal">
      <button class="close" aria-label="إغلاق">×</button>
      <h3>📏 دليل المقاسات</h3>
      <p style="font-size:12px;color:#666;">المقاسات تقريبية، ولو المنتج له قياسات خاصة اعتمد على وصف المنتج.</p>
      <table><thead><tr><th>المقاس</th><th>صدر تقريبًا</th><th>طول تقريبًا</th></tr></thead>
      <tbody>
        <tr><td>S</td><td>90–96 سم</td><td>68–70 سم</td></tr>
        <tr><td>M</td><td>96–102 سم</td><td>70–72 سم</td></tr>
        <tr><td>L</td><td>102–108 سم</td><td>72–74 سم</td></tr>
        <tr><td>XL</td><td>108–116 سم</td><td>74–76 سم</td></tr>
        <tr><td>XXL</td><td>116–124 سم</td><td>76–78 سم</td></tr>
      </tbody></table>
    </div>`;
    modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.close'))modal.remove();});
    document.body.appendChild(modal);
  });

  document.querySelectorAll('[data-zoom]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const lb = document.createElement('div');
      lb.className = 'lightbox';
      lb.innerHTML = `<button class="lb-close">✕</button><img src="${img.dataset.zoom}">`;
      lb.addEventListener('click', ()=> lb.remove());
      document.body.appendChild(lb);
    });
  });
  document.querySelectorAll('.sizes .size-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pid = el.parentElement.dataset.pid;
      state.selectedSizes[pid] = el.dataset.size;
      render();
    });
  });
  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!p) return;
      const size = state.selectedSizes[p.id] || p.sizes[0] || 'One Size';
      const existing = state.cart.find(c=>c.productId===p.id && c.size===size);
      const currentQty = existing ? existing.qty : 0;
      if(currentQty + 1 > (p.stock??0)){
        btn.textContent = 'الكمية المتاحة غير كافية';
        setTimeout(()=>{ btn.textContent='أضف إلى السلة'; }, 1200);
        return;
      }
      if(existing) existing.qty++;
      else state.cart.push({productId:p.id, name:p.name, price:p.price, size, qty:1, img:p.img});
      showToast('تمت إضافة المنتج إلى السلة 🛒');
      updateNav();
      btn.textContent = 'اتضاف ✓';
      setTimeout(()=>{ btn.textContent='أضف إلى السلة'; }, 900);
    });
  });

  let chosenStar = 0;
  document.querySelectorAll('[data-star]').forEach(s=>{
    s.addEventListener('click', ()=>{
      chosenStar = parseInt(s.dataset.star);
      document.querySelectorAll('[data-star]').forEach(x=>{
        x.style.color = parseInt(x.dataset.star) <= chosenStar ? '#f5a623' : '#d8d2c4';
      });
    });
    s.addEventListener('mouseenter', ()=>{
      const n = parseInt(s.dataset.star);
      document.querySelectorAll('[data-star]').forEach(x=>{
        x.style.color = parseInt(x.dataset.star) <= n ? '#f5a623' : '#d8d2c4';
        x.style.transform = parseInt(x.dataset.star) <= n ? 'scale(1.12)' : 'scale(1)';
      });
    });
    s.addEventListener('mouseleave', ()=>{
      document.querySelectorAll('[data-star]').forEach(x=>{
        x.style.color = parseInt(x.dataset.star) <= chosenStar ? '#f5a623' : '#d8d2c4';
        x.style.transform = 'scale(1)';
      });
    });
  });
  document.getElementById('rating-summary')?.addEventListener('click', ()=>{
    const panel = document.getElementById('reviews-panel');
    panel?.scrollIntoView({behavior:'smooth', block:'start'});
    const target = document.getElementById('star-picker') || document.getElementById('review-login-hint');
    if(target){
      setTimeout(()=>{
        if(target.id === 'review-login-hint'){
          target.style.background = 'var(--cream2)';
          target.style.color = 'var(--orange-d)';
          setTimeout(()=>{ target.style.background=''; target.style.color=''; }, 1400);
        } else {
          target.style.transform = 'scale(1.06)';
          setTimeout(()=>{ target.style.transform=''; }, 350);
        }
      }, 400);
    }
  });
  document.getElementById('submit-review')?.addEventListener('click', async ()=>{
    const err = document.getElementById('review-err');
    if(chosenStar<1){ err.innerHTML = `<div class="error-msg">اختر عدد النجوم أولًا</div>`; return; }
    const comment = document.getElementById('review-comment').value.trim();
    const { error } = await sb.from('reviews').insert({
      product_id: p.id,
      user_email: state.session.email,
      user_name: state.session.name,
      rating: chosenStar,
      comment
    });
    if(error){ err.innerHTML = `<div class="error-msg">حدث خطأ، يرجى المحاولة مرة أخرى</div>`; return; }
    state.reviews.unshift({ id:'tmp'+Date.now(), productId:p.id, userEmail:state.session.email, userName:state.session.name, rating:chosenStar, comment, date:new Date().toISOString() });
    render();
  });
}

function bindAuthEvents(){
  const to = (m)=>{ state.authMode=m; render(); };
  document.getElementById('to-register')?.addEventListener('click', ()=>to('register'));
  document.getElementById('to-login')?.addEventListener('click', ()=>to('login'));
  document.getElementById('back-login-after-reset')?.addEventListener('click', async ()=>{
    state.authMode='login'; state.authRecovery=false; state.view='login'; render();
  });
  document.getElementById('do-reset-password')?.addEventListener('click', async ()=>{
    const pass = document.getElementById('reset-pass')?.value || '';
    const confirmPass = document.getElementById('reset-pass-confirm')?.value || '';
    const err = document.getElementById('auth-err');
    if(pass.length < 6){ err.innerHTML=`<div class="error-msg">يجب أن تتكون كلمة المرور من 6 أحرف أو أرقام على الأقل.</div>`; return; }
    if(pass !== confirmPass){ err.innerHTML=`<div class="error-msg">كلمتا المرور غير متطابقتين.</div>`; return; }
    const { error } = await sb.auth.updateUser({ password: pass });
    if(error){ err.innerHTML=`<div class="error-msg">${escapeHtml(friendlyAuthError(error))}</div>`; return; }
    err.innerHTML=`<div class="ok-msg">تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.</div>`;
    showToast('تم تغيير كلمة المرور بنجاح ✅');
    setTimeout(()=>{ state.authMode='login'; state.authRecovery=false; render(); }, 1400);
  });
  document.getElementById('forgot-password')?.addEventListener('click', async ()=>{ 
    const email = document.getElementById('log-email')?.value.trim().toLowerCase();
    const err = document.getElementById('auth-err');
    if(!email){ err.innerHTML=`<div class="error-msg">أدخل بريدك الإلكتروني أولًا لإرسال رابط إعادة تعيين كلمة المرور.</div>`; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if(error){ err.innerHTML=`<div class="error-msg">${escapeHtml(friendlyAuthError(error))}</div>`; return; }
    err.innerHTML=`<div class="ok-msg">إذا كان البريد الإلكتروني مسجلًا، فسيصلك رابط لإعادة تعيين كلمة المرور 📩</div>`;
  });
  document.getElementById('do-register')?.addEventListener('click', async ()=>{
    const name = document.getElementById('reg-name')?.value.trim();
    const email = document.getElementById('reg-email')?.value.trim().toLowerCase();
    const phone = document.getElementById('reg-phone')?.value.trim() || '';
    const pass = document.getElementById('reg-pass')?.value || '';
    const confirmPass = document.getElementById('reg-pass-confirm')?.value || '';
    const err = document.getElementById('auth-err');
    if(!name || !email || !pass || !confirmPass){
      err.innerHTML=`<div class="error-msg">يرجى ملء الاسم والإيميل وكلمتي المرور. رقم الهاتف اختياري.</div>`; return;
    }
    if(email === ADMIN_EMAIL.toLowerCase()){
      err.innerHTML=`<div class="error-msg">يُنشأ حساب المسؤول من Supabase فقط. استخدم «تسجيل الدخول» بعد إنشاء الحساب.</div>`; return;
    }
    if(pass.length < 6){
      err.innerHTML=`<div class="error-msg">يجب أن تتكون كلمة المرور من 6 أحرف أو أرقام على الأقل.</div>`; return;
    }
    if(pass !== confirmPass){
      err.innerHTML=`<div class="error-msg">كلمتا المرور غير متطابقتين.</div>`; return;
    }

    const registerBtn=document.getElementById('do-register');
    if(registerBtn){registerBtn.disabled=true;registerBtn.textContent='جاري إنشاء الحساب...';}
    try{
      // Supabase قد لا يعيد خطأ عند التسجيل ببريد موجود إذا كان تأكيد البريد مفعلاً،
      // لذلك نتحقق من حسابات Auth مباشرة عبر الدالة الآمنة الموجودة في قاعدة البيانات.
      const { data: alreadyRegistered, error: checkError } = await sb.rpc('is_email_registered', { p_email: email });
      if(checkError) throw checkError;
      if(alreadyRegistered === true){
        err.innerHTML=`<div class="error-msg">هذا البريد الإلكتروني مسجل بالفعل. استخدم «تسجيل الدخول» بدل إنشاء حساب جديد.</div>`;
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email,
        password: pass,
        options: { data: { name, phone } }
      });
      if(error){
        err.innerHTML=`<div class="error-msg">${escapeHtml(friendlyAuthError(error))}</div>`; return;
      }

      if(data?.user){
        state.session = {
          name: data.user.user_metadata?.name || name,
          email: data.user.email || email,
          phone: data.user.user_metadata?.phone || phone
        };
      }

      err.innerHTML = `<div class="ok-msg" style="margin-bottom:14px;">أرسلنا رابط تأكيد إلى ${escapeHtml(email)} 📩<br>افتح بريدك الإلكتروني واضغط على الرابط، ثم عُد لتسجيل الدخول هنا.</div>`;
      showToast('تم إنشاء الحساب، تحقق من بريدك الإلكتروني 📩');
      ['reg-name','reg-email','reg-phone','reg-pass','reg-pass-confirm'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    }catch(e){
      console.error('register check',e);
      err.innerHTML=`<div class="error-msg">تعذر التحقق من البريد الإلكتروني الآن. حاول مرة أخرى.</div>`;
    }finally{
      if(registerBtn){registerBtn.disabled=false;registerBtn.textContent='إنشاء الحساب';}
    }
  });

  document.getElementById('do-login')?.addEventListener('click', async ()=>{
    const email = document.getElementById('log-email')?.value.trim().toLowerCase();
    const pass = document.getElementById('log-pass')?.value || '';
    const err = document.getElementById('auth-err');
    if(!email || !pass){
      err.innerHTML=`<div class="error-msg">أدخل البريد الإلكتروني وكلمة المرور.</div>`; return;
    }

    const loginBtn=document.getElementById('do-login');
    if(loginBtn){loginBtn.disabled=true;loginBtn.textContent='جاري تسجيل الدخول...';}
    try{
      const { data: registered, error: checkError } = await sb.rpc('is_email_registered', { p_email: email });
      if(checkError) throw checkError;
      if(registered === false){
        err.innerHTML=`<div class="error-msg">هذا البريد الإلكتروني غير مسجل. أنشئ حسابًا جديدًا أولًا.</div>`;
        return;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error){
        err.innerHTML=`<div class="error-msg">${escapeHtml(friendlyAuthError(error))}</div>`; return;
      }
      const u = data.user;
      state.session = {
        name: u.user_metadata?.name || email.split('@')[0],
        email: u.email,
        phone: u.user_metadata?.phone || ''
      };
      state.view = isAdmin() ? 'admin' : 'shop';
      if(isAdmin()){
        state.adminTab = 'orders';
        await loadAll();
        await loadAdminAnalytics();
      }
      render();
    }catch(e){
      console.error('login check',e);
      err.innerHTML=`<div class="error-msg">تعذر التحقق من الحساب الآن. حاول مرة أخرى.</div>`;
    }finally{
      if(loginBtn){loginBtn.disabled=false;loginBtn.textContent='دخول';}
    }
  });

  document.getElementById('logout-btn')?.addEventListener('click', async ()=>{
    await sb.auth.signOut();
    state.session=null; state.view='shop'; render();
  });

  document.querySelectorAll('[data-cancel-order]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const orderId = btn.dataset.cancelOrder;
      if(!orderId || !state.session) return;
      if(!confirm('هل أنت متأكد من إلغاء الطلب؟')) return;
      btn.disabled=true;
      btn.textContent='جاري الإلغاء...';
      try{
        const { data, error } = await sb.rpc('cancel_order', { p_order_id: orderId });
        if(error) throw error;
        showToast('تم إلغاء الطلب بنجاح');
        await loadAll();
        render();
      }catch(e){
        console.error('cancel order',e);
        showToast('تعذر إلغاء الطلب. قد يكون تم تجهيزه بالفعل.');
        btn.disabled=false;
        btn.textContent='إلغاء الطلب';
      }
    });
  });
}

function bindCartEvents(){
  document.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.cart.splice(parseInt(btn.dataset.rm),1);
      render();
    });
  });
  document.getElementById('confirm-order')?.addEventListener('click', async ()=>{
    const phone = document.getElementById('ord-phone').value.trim();
    const address = document.getElementById('ord-address').value.trim();
    const err = document.getElementById('ord-err');
    if(!phone || !address){ err.innerHTML = `<div class="error-msg">أدخل رقم الهاتف والعنوان</div>`; return; }
    const total = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
    const items = state.cart.map(c=>({productId:c.productId, name:c.name, price:c.price, size:c.size, qty:c.qty}));

    /*
     * الطلب والمخزون يتم التعامل معهما داخل RPC محمية في Supabase.
     * لا نسمح للمتصفح بتعديل products مباشرة عند الشراء، لأن ذلك كان يسمح
     * بالتلاعب بالسعر/المخزون عبر DevTools حتى لو كانت الواجهة سليمة.
     */
    const { data: orderRow, error } = await sb.rpc('place_order', {
      p_items: items,
      p_phone: phone,
      p_address: address
    });
    if(error){
      const code = String(error.message || '').toUpperCase();
      const msg = code.includes('OUT_OF_STOCK') ? 'أحد المنتجات غير متوفر أو أن الكمية المطلوبة أكبر من المتاح.'
        : code.includes('PRODUCT_NOT_FOUND') ? 'واحد من المنتجات لم يعد متاحًا. حدّث الصفحة وحاول مرة أخرى.'
        : code.includes('AUTH_REQUIRED') ? 'انتهت جلسة الدخول. يرجى تسجيل الدخول مرة أخرى.'
        : code.includes('INVALID_PHONE') ? 'أدخل رقم هاتف صحيح.'
        : code.includes('INVALID_ADDRESS') ? 'أدخل العنوان بالتفصيل.'
        : 'حدث خطأ أثناء تسجيل الطلب. يرجى المحاولة مرة أخرى.';
      err.innerHTML = `<div class="error-msg">${msg}</div>`; return;
    }

    const order = orderFromRow(Array.isArray(orderRow) ? orderRow[0] : orderRow);
    state.orders.unshift(order);
    state.cart = [];
    state.view = 'order-success';
    state.lastOrder = order;
    renderOrderSuccess();

    // إرسال إشعار الطلب للإدارة عبر Supabase Edge Function + Resend.
    // فشل الإيميل لا يلغي الطلب لأنه تم تسجيله بالفعل في قاعدة البيانات.
    try {
      const { error: mailError } = await sb.functions.invoke('smooth-worker', {
        body: {
          id: order.id,
          userEmail: order.userEmail,
          userName: order.userName,
          items: order.items,
          total: order.total,
          phone: order.phone,
          address: order.address
        }
      });
      if (mailError) console.error('Order email notification failed:', mailError); else console.log('Order email notification sent successfully.');
    } catch (mailError) {
      console.error('Order email notification failed:', mailError);
    }
  });
}

}

/* ============ ADMIN ============ */
function isAdmin(){
  return !!state.session &&
    String(state.session.email || '').trim().toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

function friendlyAuthError(error){
  const m = String(error?.message || '').toLowerCase();
  if(m.includes('invalid login credentials')) return 'الإيميل أو كلمة المرور غير صحيح.';
  if(m.includes('email not confirmed') || m.includes('confirm')) return 'يجب تأكيد البريد الإلكتروني أولًا من الرسالة التي وصلتك.';
  if(m.includes('user already registered') || m.includes('already registered')) return 'هذا البريد الإلكتروني مسجل بالفعل. استخدم تسجيل الدخول بدل إنشاء حساب.';
  if(m.includes('password')) return 'كلمة المرور غير صالح أو أقل من الحد المطلوب.';
  if(m.includes('rate limit')) return 'تمت محاولات كثيرة خلال وقت قصير. انتظر قليلًا ثم حاول مرة أخرى.';
  return 'حدث خطأ في الخدمة. حاول مرة أخرى، وإذا استمر الخطأ فتحقق من إعدادات المشروع.';
}

function bindAdminEvents(){
  document.getElementById('go-admin-login')?.addEventListener('click', ()=>{

    state.view = 'login';

  });

  document.querySelectorAll('[data-view]').forEach(btn=>{

    });
  });

  document.getElementById('admin-logout')?.addEventListener('click', async ()=>{

    state.orders = [];
    state.view = 'shop';
    render();
  });
  document.querySelectorAll('.tabs [data-tab]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.adminTab = btn.dataset.tab;
      if(state.adminTab==='analytics') await loadAdminAnalytics();
      render();
    });
  });
  document.getElementById('admin-all-orders-card')?.addEventListener('click', ()=>{
    state.adminOrderFilter='all';
    state.adminTab='orders';
    render();
  });
  document.getElementById('admin-refresh-data')?.addEventListener('click', async ()=>{
    const btn=document.getElementById('admin-refresh-data');
    if(btn){btn.disabled=true;btn.textContent='⏳ جاري التحديث...';}
    try{
      await loadAll();
      showToast('تم تحديث بيانات المتجر');
    }finally{
      render();
    }
  });
  document.getElementById('admin-reset-revenue')?.addEventListener('click', async ()=>{
    if(!isAdmin()) return;
    if(!confirm('تصفير الإيرادات سيجعل عداد المبيعات يبدأ من الآن، بدون حذف الطلبات. هل تريد المتابعة؟')) return;
    const btn=document.getElementById('admin-reset-revenue');
    if(btn){btn.disabled=true;btn.textContent='جاري التصفير...';}
    try{
      const { data, error } = await sb.rpc('reset_revenue_counter');
      if(error) throw error;
      state.revenueResetAt = data || new Date().toISOString();
      showToast('تم تصفير عداد الإيرادات ✅');
    }catch(e){
      console.error('reset revenue',e);
      showToast('تعذر تصفير الإيرادات');
    }finally{
      render();
    }
  });

  document.getElementById('admin-open-new-orders')?.addEventListener('click', ()=>{
    state.adminOrderFilter='new';
    state.adminTab='orders';
    render();
  });
  document.getElementById('admin-open-products')?.addEventListener('click', ()=>{
    state.adminTab='products';
    state.adminOrderFilter='all';
    render();
  });
  document.getElementById('admin-new-orders-card')?.addEventListener('click', ()=>{
    state.adminOrderFilter='new';
    state.adminTab='orders';
    render();
  });
  document.getElementById('admin-show-new-orders')?.addEventListener('click', ()=>{
    state.adminOrderFilter='new';
    render();
  });
  document.getElementById('admin-show-all-orders')?.addEventListener('click', ()=>{
    state.adminOrderFilter='all';
    render();
  });
  const orderSearch = document.getElementById('order-search');
  const searchOrderBtn = document.getElementById('search-order');
  const clearOrderSearch = document.getElementById('clear-order-search');

  const normalizeOrderId = (value)=>{
    return String(value || '').trim().replace(/^#+/, '').trim().toLowerCase();
  };

  const renderOrderResults = (orders)=>{
    const list = document.getElementById('admin-orders-list');
    if(!list) return;
    const sorted = (orders || []).slice().reverse();
    list.innerHTML = sorted.length
      ? sorted.map(o=>orderCardHtml(o,true)).join('')
      : `<div class="empty">لا يوجد طلب بهذا الرقم</div>`;
    bindAdminStatusButtons();
  };

  const searchOrder = async ()=>{
    if(!isAdmin()) return;
    const list = document.getElementById('admin-orders-list');
    const q = normalizeOrderId(orderSearch?.value);

    if(!list) return;
    if(!q){
      renderOrderResults(state.orders);
      orderSearch?.focus();
      return;
    }

    if(searchOrderBtn) searchOrderBtn.disabled = true;
    list.innerHTML = `<div class="empty">جاري البحث عن الطلب...</div>`;

    try{
      // البحث المحلي أولاً برقم الطلب فقط.
      const local = state.orders.filter(o=>normalizeOrderId(o.id)===q);
      if(local.length){
        renderOrderResults(local);
        return;
      }

      // لو الطلب غير موجود في القائمة الحالية، نبحث عنه مباشرة في Supabase.
      const { data, error } = await sb
        .from('orders')
        .select('*')
        .eq('id', q)
        .limit(1);

      if(error) throw error;
      const found = (data || []).map(orderFromRow);

      // احتياط لو رقم الطلب مخزن بحروف كبيرة/صغيرة مختلفة.
      if(!found.length){
        const allIds = state.orders.filter(o=>normalizeOrderId(o.id)===q);
        renderOrderResults(allIds);
      }else{
        renderOrderResults(found);
      }
    }catch(e){
      console.error('order search', e);
      list.innerHTML = `<div class="empty">حدث خطأ أثناء البحث. يرجى التحقق من رقم الطلب والمحاولة مرة أخرى.</div>`;
    }finally{
      if(searchOrderBtn) searchOrderBtn.disabled = false;
    }
  };

  searchOrderBtn?.addEventListener('click', searchOrder);
  orderSearch?.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      searchOrder();
    }
  });
  clearOrderSearch?.addEventListener('click', ()=>{
    if(orderSearch) orderSearch.value='';
    renderOrderResults(state.orders);
    orderSearch?.focus();
  });

  // لو بنعدل منتج، ابدأ المعاينة بالصور الموجودة بالفعل
  if(state.editingProduct && tempImages.length===0){
    tempImages = (state.editingProduct.images && state.editingProduct.images.length)
      ? [...state.editingProduct.images]
      : (state.editingProduct.img ? [state.editingProduct.img] : []);
  }
  renderPreviewList();

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('p-file');
  dropZone?.addEventListener('click', ()=>fileInput.click());
  fileInput?.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files || []);
    let remaining = files.length;
    if(remaining===0) return;
    files.forEach(file=>{
      resizeImageToBase64(file, 1600, (dataUrl)=>{
        tempImages.push(dataUrl);
        remaining--;
        if(remaining===0) renderPreviewList();
      });
    });
  });

  document.getElementById('save-prod')?.addEventListener('click', async ()=>{
    const name = document.getElementById('p-name').value.trim();
    const price = parseFloat(document.getElementById('p-price').value);
    const desc = document.getElementById('p-desc').value.trim();
    const category = document.getElementById('p-category').value;
    const sizes = document.getElementById('p-sizes').value.split(',').map(s=>s.trim()).filter(Boolean);
    const stock = parseInt(document.getElementById('p-stock').value) || 0;
    const err = document.getElementById('prod-err');
    if(!name || !price || sizes.length===0){ err.innerHTML = `<div class="error-msg">املأ الاسم والسعر والمقاسات</div>`; return; }

    const images = tempImages.slice();
    const mainImg = images[0] || '';

    if(state.editingProduct){
      const p = state.products.find(x=>x.id===state.editingProduct.id);
      const { error } = await sb.from('products').update({
        name, price, description: desc, category, sizes, stock, img: mainImg, images
      }).eq('id', p.id);
      if(error){ err.innerHTML = `<div class="error-msg">حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى</div>`; return; }
      p.name=name; p.price=price; p.desc=desc; p.category=category; p.sizes=sizes; p.stock=stock; p.img=mainImg; p.images=images;
      state.editingProduct = null;
    } else {
      const newP = { id: 'p' + Date.now(), name, price, desc, category, sizes, stock, img: mainImg, images };
      const { error } = await sb.from('products').insert({
        id: newP.id, name: newP.name, price: newP.price, description: newP.desc, category: newP.category,
        sizes: newP.sizes, stock: newP.stock, img: newP.img, images: newP.images
      });
      if(error){ err.innerHTML = `<div class="error-msg">حدث خطأ أثناء الإضافة، يرجى المحاولة مرة أخرى</div>`; return; }
      state.products.push(newP);
    }
    tempImages = [];
    render();
  });

  document.getElementById('cancel-edit')?.addEventListener('click', ()=>{
    state.editingProduct = null; tempImages=[]; render();
  });

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editingProduct = state.products.find(p=>p.id===btn.dataset.edit);
      tempImages = [];
      window.scrollTo({top:0,behavior:'smooth'});
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
      const { error } = await sb.from('products').delete().eq('id', btn.dataset.del);
      if(error){ alert('حدث خطأ أثناء الحذف'); return; }
      state.products = state.products.filter(p=>p.id!==btn.dataset.del);
      render();
    });
  });
  bindAdminStatusButtons();
}

function bindAdminStatusButtons(){
  document.querySelectorAll('[data-status]').forEach(btn=>{
    if(btn.dataset.bound==='1') return;
    btn.dataset.bound='1';
    btn.addEventListener('click', async ()=>{
      if(!isAdmin()) return;
      const [id, status] = btn.dataset.status.split('|');
      btn.disabled = true;
      const { error } = await sb.from('orders').update({ status }).eq('id', id);
      btn.disabled = false;
      if(error){ alert('حدث خطأ أثناء تحديث الحالة'); return; }
      const o = state.orders.find(x=>x.id===id);
      if(o){ o.status = status; render(); }
    });
  });
}

/* ============ IMAGE HELPER ============ */
function resizeImageToBase64(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg', 0.95));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ UTIL ============ */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function bindViewEvents(){
  // روابط التنقّل العامة تعمل في كل الصفحات، ومنها زر «رجوع للمتجر»
  // الموجود في صفحة المفضلة. نستخدم علامة لمنع تكرار المستمع نفسه.
  document.querySelectorAll('[data-view]').forEach(el=>{
    if(el.dataset.navBound==='1') return;
    el.dataset.navBound='1';
    el.addEventListener('click',(e)=>{
      // الروابط التي تتطلب سلوكًا خاصًا (مثل أزرار المنتجات) لا تصل إلى هنا
      // إلا إذا كانت تحمل data-view فقط.
      if(el.tagName==='A') e.preventDefault();
      const target=el.dataset.view;
      if(target) setView(target);
    });
  });

  if(state.view==='shop') bindShopEvents();
  if(state.view==='product') bindProductPageEvents();
  if(state.view==='login') bindAuthEvents();
  if(state.view==='account') bindAuthEvents();
  if(state.view==='cart') bindCartEvents();
  if(state.view==='wishlist') {
    document.getElementById('wishlist-back')?.addEventListener('click',()=>{
      if(window.history.length>1) window.history.back();
      else setView('shop');
    });
  }
  if(state.view==='settings') bindSettingsEvents();
  if(state.view==='admin') bindAdminEvents();
}

/* ============ ANALYTICS ============ */
function getVisitorId(){
  let id = localStorage.getItem('ody_visitor_id');
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem('ody_visitor_id', id);
  }
  return id;
}

async function recordVisit(){
  try{
    if(sessionStorage.getItem('ody_visit_recorded') === '1') return;
    const fn = state.session ? 'record_store_visit_auth' : 'record_store_visit';
    await sb.rpc(fn, {
      p_visitor_id: getVisitorId(),
      p_path: window.location.pathname + window.location.hash,
      p_referrer: document.referrer || null
    });
    sessionStorage.setItem('ody_visit_recorded','1');
  }catch(e){ console.warn('analytics visit', e); }
}

async function loadAdminAnalytics(){
  if(!isAdmin()) return;
  try{
    const { data, error } = await sb.rpc('get_admin_analytics');
    if(error) throw error;
    state.analytics = data || null;
  }catch(e){
    console.error('admin analytics', e);
    state.analytics = null;
  }
}

function formatDateTime(value){
  if(!value) return 'غير متاح';
  try{return new Date(value).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});}catch{return 'غير متاح';}
}

function renderAdminAnalytics(){
  const a = state.analytics || {};
  const users = Array.isArray(a.recent_users) ? a.recent_users : [];
  const visitors = Array.isArray(a.recent_visitors) ? a.recent_visitors : [];
  return `
  <div class="analytics-grid">
    <div class="stat-card"><div class="lbl">إجمالي الزيارات</div><div class="num">${Number(a.total_visits||0).toLocaleString('ar-EG')}</div></div>
    <div class="stat-card"><div class="lbl">الزوار المميزون</div><div class="num">${Number(a.unique_visitors||0).toLocaleString('ar-EG')}</div></div>
    <div class="stat-card"><div class="lbl">المستخدمون المسجلون</div><div class="num">${Number(a.registered_users||0).toLocaleString('ar-EG')}</div></div>
    <div class="stat-card"><div class="lbl">الزوار اليوم</div><div class="num">${Number(a.active_today||0).toLocaleString('ar-EG')}</div></div>
  </div>
  <div class="analytics-panels">
    <div class="panel" style="margin:0;">
      <h2 style="font-size:18px">أحدث المستخدمين المسجلين</h2>
      <div class="analytics-list">
        ${users.length ? users.map(u=>`<div class="analytics-item"><div><strong>${escapeHtml(u.name||'مستخدم')}</strong><div>${escapeHtml(u.email||'')}</div></div><small>${formatDateTime(u.last_seen_at)}</small></div>`).join('') : '<div class="empty">لا يوجد مستخدمون مسجلون بعد.</div>'}
      </div>
    </div>
    <div class="panel" style="margin:0;">
      <h2 style="font-size:18px">أحدث الزوار</h2>
      <div class="analytics-list">
        ${visitors.length ? visitors.map(v=>`<div class="analytics-item"><div><strong>${escapeHtml(v.name||'زائر غير مسجل')}</strong><div>${escapeHtml(v.email||('معرّف الزائر: '+String(v.visitor_id||'').slice(0,12)))}</div></div><small>${formatDateTime(v.last_seen_at)}<br>عدد الزيارات: ${Number(v.visit_count||0)}</small></div>`).join('') : '<div class="empty">لم تُسجّل زيارات بعد.</div>'}
      </div>
    </div>
  </div>`;
}

/* ============ INIT ============ */
async function init(){
  const hash = String(window.location.hash || '');
  const m = hash.match(/^#category=([^&]+)/);
  if(m){ state.selectedCategory = decodeURIComponent(m[1]); localStorage.setItem('ody_category', state.selectedCategory); }
  applyPreferences();
  document.getElementById('app').innerHTML = `<div class="loading"><div class="spinner"></div><div style="font-weight:800;margin-bottom:12px;">جارٍ تجهيز المتجر...</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:560px;margin:0 auto;"><div style="height:180px;border-radius:16px;background:linear-gradient(90deg,#f3f3f3 25%,#fafafa 37%,#f3f3f3 63%);background-size:400% 100%;animation:odySkeleton 1.2s infinite;"></div><div style="height:180px;border-radius:16px;background:linear-gradient(90deg,#f3f3f3 25%,#fafafa 37%,#f3f3f3 63%);background-size:400% 100%;animation:odySkeleton 1.2s infinite;"></div></div></div>`;

  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.session = {
      name: session.user.user_metadata?.name || session.user.email.split('@')[0],
      email: session.user.email,
      phone: session.user.user_metadata?.phone || ''
    };
  }
  if(hash.includes('type=recovery')){
    state.authRecovery = true;
    state.authMode = 'reset';
    state.view = 'login';
  }

  await loadAll();
  await recordVisit();
  if(isAdmin()){ state.view='admin'; await loadAdminAnalytics(); }
  render();
}
sb.auth.onAuthStateChange((event, session)=>{
  if(event==='PASSWORD_RECOVERY'){
    state.session = session?.user ? {name: session.user.user_metadata?.name || session.user.email.split('@')[0], email: session.user.email, phone: session.user.user_metadata?.phone || ''} : state.session;
    state.authRecovery = true;
    state.authMode = 'reset';
    state.view = 'login';
    render();
  }
});

init();
</script>
