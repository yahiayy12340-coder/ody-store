<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ody Store — أودي ستور</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --cream:#F1EADA;
    --cream2:#E9E1CC;
    --navy:#132C2A;
    --navy2:#1B3937;
    --orange:#CE4E2B;
    --orange-d:#B8431F;
    --yellow:#F1BA1E;
    --ink:#1C1B16;
    --muted:#6E6B5C;
    --line:rgba(28,27,22,0.14);
    --line-navy:rgba(241,234,218,0.16);
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
  }

  body{
    min-height:100vh;
  }

  h1,h2,h3,h4{
    font-weight:900;
    line-height:1.15;
  }

  p{
    line-height:1.85;
    color:var(--muted);
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  button{
    font-family:'Cairo',sans-serif;
    cursor:pointer;
  }

  img{
    max-width:100%;
    display:block;
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 22px;
  }

  /* ================= HEADER ================= */

  header{
    position:sticky;
    top:0;
    z-index:60;
    background:rgba(241,234,218,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 12px rgba(28,27,22,.04);
  }

  .nav-wrap{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    user-select:none;
  }

  .brand .box{
    width:38px;
    height:38px;
    background:var(--orange);
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:16px;
    border-radius:9px;
    flex-shrink:0;
  }

  .brand .name{
    font-size:18px;
    font-weight:900;
    letter-spacing:.3px;
  }

  .brand .name b{
    color:var(--orange);
  }

  .icon-btns{
    display:flex;
    gap:8px;
  }

  .icon-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:none;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:17px;
    transition:
      background .15s,
      border-color .15s,
      transform .1s;
  }

  .icon-btn:hover{
    background:var(--cream2);
    border-color:var(--orange);
  }

  .icon-btn:active{
    transform:scale(.92);
  }

  .icon-btn .dot{
    position:absolute;
    top:-3px;
    left:-3px;
    background:var(--orange);
    color:#fff;
    font-size:10px;
    width:17px;
    height:17px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
  }

  .menu-panel{
    max-width:760px;
    margin:0 auto;
    padding:0 22px;
    overflow:hidden;
    max-height:0;
    transition:max-height .25s ease;
  }

  .menu-panel.open{
    max-height:300px;
  }

  .menu-panel .inner{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:10px 0 18px;
  }

  .menu-panel button{
    background:none;
    border:none;
    text-align:right;
    padding:11px 6px;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    border-radius:6px;
  }

  .menu-panel button.active{
    color:var(--orange);
  }

  .menu-panel button:hover{
    background:var(--cream2);
  }

  /* ================= BUTTONS ================= */

  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    border-radius:30px;
    padding:10px 20px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.3px;
  }

  .pill.dark{
    background:var(--navy);
    color:var(--cream);
    border:none;
  }

  .pill.dark:hover{
    background:var(--navy2);
  }

  .pill.ghost:hover{
    background:rgba(28,27,22,.05);
  }

  .btn-main{
    width:100%;
    background:var(--orange);
    color:#fff;
    border:none;
    padding:14px 18px;
    border-radius:12px;
    font-size:15px;
    font-weight:900;
    transition:.15s;
  }

  .btn-main:hover{
    background:var(--orange-d);
  }

  .btn-main:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .btn-ghost{
    width:100%;
    background:none;
    color:var(--ink);
    border:1px solid var(--line);
    padding:13px 18px;
    border-radius:12px;
    font-size:14px;
    font-weight:800;
    margin-top:8px;
  }

  .btn-ghost:hover{
    background:var(--cream2);
  }

  /* ================= HERO ================= */

  .hero{
    padding:46px 0 10px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    letter-spacing:2px;
    color:var(--orange);
    font-weight:800;
    margin-bottom:22px;
  }

  .eyebrow .dash{
    width:26px;
    height:2px;
    background:var(--orange);
  }

  .hero h1{
    font-size:56px;
    letter-spacing:-1px;
  }

  .hero h1 .l1{
    color:var(--navy);
    display:block;
  }

  .hero h1 .l2{
    color:var(--orange);
    display:block;
  }

  .hero p.lead{
    font-size:16px;
    margin:22px 0 26px;
    max-width:480px;
  }

  .btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:44px;
  }

  /* ================= POSTER ================= */

  .poster{
    background:var(--orange);
    border-radius:26px;
    padding:30px 26px 40px;
    position:relative;
    overflow:hidden;
    margin-bottom:20px;
  }

  .poster::before{
    content:'';
    position:absolute;
    top:-60px;
    left:-60px;
    width:220px;
    height:220px;
    border:34px solid var(--yellow);
    border-radius:50%;
    opacity:.9;
  }

  .poster-top{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:2px;
    color:rgba(241,234,218,.8);
    font-weight:800;
    position:relative;
    z-index:2;
  }

  .poster h2{
    color:var(--cream);
    font-size:52px;
    line-height:.98;
    margin:26px 0 18px;
    position:relative;
    z-index:2;
  }

  .poster h2 span{
    display:block;
  }

  .poster p{
    color:rgba(241,234,218,.85);
    font-size:15px;
    max-width:280px;
    position:relative;
    z-index:2;
  }

  .poster-bottom{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-top:34px;
    position:relative;
    z-index:2;
  }

  .rot-tag{
    border:1.5px solid rgba(241,234,218,.4);
    color:rgba(241,234,218,.75);
    font-size:11px;
    padding:14px 16px;
    transform:rotate(-8deg);
    letter-spacing:1px;
  }

  .sticker{
    background:var(--yellow);
    color:var(--ink);
    font-size:12px;
    font-weight:800;
    padding:9px 16px;
    border-radius:20px;
    transform:rotate(-3deg);
    position:absolute;
    bottom:-14px;
    right:20px;
    box-shadow:2px 3px 0 rgba(0,0,0,.15);
    z-index:3;
  }

  .circ-arrow{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--yellow);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:900;
    flex-shrink:0;
  }

  /* ================= MARQUEE ================= */

  .marquee{
    background:var(--yellow);
    overflow:hidden;
    white-space:nowrap;
    padding:13px 0;
    margin-bottom:46px;
  }

  .marquee-track{
    display:inline-block;
    animation:scroll 18s linear infinite;
    font-weight:800;
    font-size:13px;
    letter-spacing:1px;
    color:var(--ink);
  }

  .marquee-track span{
    margin:0 22px;
  }

  @keyframes scroll{
    0%{
      transform:translateX(0);
    }

    100%{
      transform:translateX(-50%);
    }
  }

  @media (prefers-reduced-motion:reduce){
    .marquee-track{
      animation:none;
    }
  }

  /* ================= SECTION ================= */

  .sec-title{
    margin-bottom:26px;
  }

  .sec-title h3{
    font-size:30px;
    color:var(--navy);
  }

  /* ================= PRODUCTS ================= */

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding-bottom:50px;
  }

  @media(min-width:640px){
    .grid{
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:16px;
    }
  }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:
      transform .18s ease,
      box-shadow .18s ease,
      border-color .18s ease;
  }

  .card:hover{
    border-color:var(--orange);
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(28,27,22,.09);
  }

  .card:active{
    transform:translateY(-1px);
  }

  .card .imgwrap{
    aspect-ratio:1/1;
    background:var(--cream2);
    position:relative;
    overflow:hidden;
  }

  .card .imgwrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:zoom-in;
    transition:transform .3s ease;
  }

  .card:hover .imgwrap img{
    transform:scale(1.04);
  }

  .card .imgwrap .noimg{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    color:var(--muted);
    font-size:12px;
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,18,15,.92);
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:12px;
  }

  .lightbox .lb-close{
    position:absolute;
    top:18px;
    left:18px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    border:none;
    font-size:20px;
  }

  .price-tag{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--navy);
    color:var(--cream);
    font-size:12px;
    font-weight:800;
    padding:5px 11px;
    border-radius:20px;
  }

  .card .body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }

  .card h4{
    font-size:16px;
    color:var(--ink);
  }

  .card .desc{
    color:var(--muted);
    font-size:12.5px;
    line-height:1.6;
    flex:1;
  }

  .sizes{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }

  .size-opt{
    border:1px solid var(--line);
    padding:4px 10px;
    font-size:11.5px;
    border-radius:20px;
    color:var(--muted);
    cursor:pointer;
  }

  .size-opt.sel{
    border-color:var(--orange);
    color:var(--orange);
    background:rgba(206,78,43,.06);
  }

  .add-btn{
    margin-top:6px;
    background:var(--navy);
    color:var(--cream);
    border:none;
    padding:11px;
    font-weight:800;
    font-size:13.5px;
    border-radius:10px;
  }

  .add-btn:hover{
    background:var(--orange);
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
    background:#fff;
    border:1px dashed var(--line);
    border-radius:18px;
  }

  /* ================= FEATURES ================= */

  .feat-row{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:50px;
  }

  .feat{
    border-radius:20px;
    padding:26px 24px;
  }

  .feat.dark{
    background:var(--navy);
    color:var(--cream);
  }

  .feat.dark p{
    color:rgba(241,234,218,.7);
  }

  .feat.outline{
    border:1.5px solid var(--line);
    background:#fff;
  }

  .feat .ico{
    font-size:22px;
    margin-bottom:16px;
    display:block;
  }

  .feat h4{
    font-size:19px;
    margin-bottom:8px;
  }

  .feat.dark h4{
    color:var(--cream);
  }

  /* ================= QUOTE ================= */

  .quote-sec{
    padding:20px 0 50px;
  }

  .quote-sec blockquote{
    font-size:27px;
    font-weight:800;
    color:var(--navy);
    line-height:1.4;
    margin:18px 0 22px;
  }

  .quote-sec p.desc{
    font-size:15px;
    max-width:520px;
  }

  .byline{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:24px;
    font-size:12px;
    letter-spacing:1px;
    color:var(--muted);
    font-weight:700;
  }

  .byline .dash{
    width:30px;
    height:2px;
    background:var(--orange);
  }

  /* ================= FOOTER ================= */

  .band{
    background:var(--navy);
    color:var(--cream);
    border-radius:26px 26px 0 0;
    padding:44px 22px 34px;
    margin-top:10px;
  }

  .band .inner{
    max-width:760px;
    margin:0 auto;
  }

  .band h2{
    font-size:34px;
    margin-bottom:14px;
  }

  .band p{
    color:rgba(241,234,218,.65);
    font-size:14.5px;
    max-width:420px;
    margin-bottom:26px;
  }

  .band .links{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    font-size:13px;
    font-weight:700;
    border-top:1px solid var(--line-navy);
    padding-top:20px;
  }

  .band .links button{
    background:none;
    border:none;
    color:rgba(241,234,218,.8);
  }

  /* ================= FORMS ================= */

  .form-page{
    min-height:calc(100vh - 70px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:35px 20px;
  }

  .form-card{
    width:100%;
    max-width:470px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:24px;
    padding:30px;
    box-shadow:0 15px 40px rgba(28,27,22,.07);
  }

  .form-card .logo-mini{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:25px;
  }

  .form-card .logo-mini .box{
    width:38px;
    height:38px;
    background:var(--orange);
    color:#fff;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
  }

  .form-card h2{
    text-align:center;
    color:var(--navy);
    margin-bottom:8px;
    font-size:30px;
  }

  .form-card .sub{
    text-align:center;
    margin-bottom:25px;
    color:var(--muted);
  }

  .field{
    margin-bottom:16px;
  }

  .field label{
    display:block;
    font-size:13px;
    font-weight:800;
    margin-bottom:7px;
    color:var(--ink);
  }

  .field input,
  .field textarea,
  .field select{
    width:100%;
    border:1px solid var(--line);
    background:var(--cream);
    border-radius:11px;
    padding:13px 14px;
    font-family:'Cairo',sans-serif;
    font-size:14px;
    outline:none;
  }

  .field textarea{
    resize:vertical;
    min-height:90px;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(206,78,43,.08);
  }

  .error-msg{
    background:#fff2ef;
    border:1px solid #e2a99b;
    color:#a93f29;
    padding:11px 13px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:15px;
  }

  .success-msg{
    background:#effaf0;
    border:1px solid #a9d8ac;
    color:#26702d;
    padding:11px 13px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:15px;
  }

  .auth-switch{
    text-align:center;
    margin-top:18px;
    color:var(--muted);
    font-size:13px;
  }

  .auth-switch button{
    background:none;
    border:none;
    color:var(--orange);
    font-weight:900;
  }

  /* ================= CART ================= */

  .page-head{
    padding:35px 0 25px;
  }

  .page-head h2{
    font-size:34px;
    color:var(--navy);
  }

  .cart-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .cart-item{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px;
    display:flex;
    gap:13px;
    align-items:center;
  }

  .cart-item img{
    width:78px;
    height:78px;
    object-fit:cover;
    border-radius:10px;
    background:var(--cream2);
    flex-shrink:0;
  }

  .cart-item .ci-info{
    flex:1;
    min-width:0;
  }

  .cart-item h4{
    font-size:14px;
    margin-bottom:5px;
  }

  .cart-item .meta{
    color:var(--muted);
    font-size:11px;
  }

  .qty{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }

  .qty button{
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--cream);
    font-weight:900;
  }

  .qty span{
    min-width:22px;
    text-align:center;
    font-weight:800;
  }

  .remove-btn{
    background:none;
    border:none;
    color:#b84a34;
    font-size:12px;
    font-weight:800;
  }

  .cart-summary{
    background:var(--navy);
    color:var(--cream);
    border-radius:18px;
    padding:20px;
    margin-top:18px;
  }

  .cart-summary .line{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:10px;
  }

  .cart-summary .total{
    border-top:1px solid var(--line-navy);
    padding-top:13px;
    margin-top:13px;
    font-size:20px;
    font-weight:900;
  }

  /* ================= ACCOUNT ================= */

  .account-box{
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
    margin-bottom:16px;
  }

  .account-box h3{
    color:var(--navy);
    font-size:20px;
    margin-bottom:15px;
  }

  .account-info{
    display:grid;
    gap:8px;
  }

  .account-info div{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }

  .account-info div:last-child{
    border-bottom:none;
  }

  .account-info span:first-child{
    color:var(--muted);
  }

  /* ================= ORDERS ================= */

  .order-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:12px;
  }

  .order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
    margin-bottom:12px;
  }

  .order-head h4{
    font-size:14px;
  }

  .order-date{
    color:var(--muted);
    font-size:11px;
  }

  .status{
    display:inline-flex;
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:900;
  }

  .status.new{
    background:#fff4d8;
    color:#8a6500;
  }

  .status.preparing{
    background:#fff0e9;
    color:#a94b28;
  }

  .status.delivered{
    background:#eaf7eb;
    color:#26702d;
  }

  .order-items{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin:12px 0;

/* =========================================================

const sb =
  supabase.createClient(

/* =========================================================

const ADMIN_EMAIL =

function isAdmin(){
  return !!(
    state.session &&
    state.session.email &&
    state.session.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()

/* =========================================================

   CART STORAGE
   ========================================================= */

  localStorage.setItem(

/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(str){

  return String(str || '')
    .replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[m])
    );

}


function escapeAttr(str){

  return escapeHtml(str);

}


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts(){

  const {
    data,
    error
  } = await sb
    .from('products')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){

    console.error(error);

    return [];

  }

  return data || [];

}


/* =========================================================
   LOAD ORDERS
   ========================================================= */

async function loadOrders(){

  if(!isAdmin()){

    return [];

  }

  const {
    data,
    error
  } = await sb
    .from('orders')
    .select('*')
    .order('order_date',{ascending:false});

  if(error){

    console.error(error);

    return [];

  }

  return data || [];

}


/* =========================================================
   LOAD ALL
   ========================================================= */

async function loadAll(){

  state.products =
    await loadProducts();

  state.orders =
    await loadOrders();

}


/* =========================================================
   VIEW
   ========================================================= */

function setView(view){

  if(view === 'admin' && !isAdmin()){

    state.view = 'login';

    state.authMode = 'login';

    render();

    return;

  }

  state.view = view;

  render();

}


/* =========================================================
   HEADER
   ========================================================= */

function updateHeader(){

  const adminBtn =
    document.getElementById('admin-btn');

  const menuAdmin =
    document.getElementById('menu-admin');

  if(isAdmin()){

    if(adminBtn)
      adminBtn.style.display = 'flex';

    if(menuAdmin)
      menuAdmin.style.display = 'block';

  }else{

    if(adminBtn)
      adminBtn.style.display = 'none';

    if(menuAdmin)
      menuAdmin.style.display = 'none';

  }


  const count =
    state.cart.reduce(
      (sum,item)=>sum + item.qty,
      0
    );

  const cartCount =
    document.getElementById('cart-count');

  if(cartCount)
    cartCount.textContent = count;

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  updateHeader();

  const app =
    document.getElementById('app');

  if(!app)
    return;


  if(state.view === 'shop'){

    app.innerHTML =
      renderShop();

  }

  else if(state.view === 'product'){

    app.innerHTML =
      renderProductPage();

  }

  else if(state.view === 'login'){

    app.innerHTML =
      renderAuth('login');

  }

  else if(state.view === 'account'){

    app.innerHTML =
      renderAccount();

  }

  else if(state.view === 'cart'){

    app.innerHTML =
      renderCart();

  }

  else if(state.view === 'admin'){

    if(!isAdmin()){

      state.view = 'login';

      state.authMode = 'login';

      app.innerHTML =
        renderAuth('login');

    }else{

      app.innerHTML =
        renderAdmin();

    }

  }

  bindViewEvents();

  updateHeader();

}

/* =========================================================
   PRODUCT CARD
   ========================================================= */

function productCardHtml(p){

  const img =
    p.img ||
    (
      p.images &&
      p.images.length
        ? p.images[0]
        : ''
    );


  return `

  <div
    class="card"
    data-product="${escapeAttr(p.id)}">

    <div class="imgwrap">

      ${
        img
        ?
        `<img
          src="${escapeAttr(img)}"
          alt="${escapeAttr(p.name)}"
          data-image="${escapeAttr(img)}">`
        :
        `<div class="noimg">
          لا توجد صورة
        </div>`
      }

      <div class="price-tag">
        ${Number(p.price || 0)} ج.م
      </div>

    </div>


    <div class="body">

      <h4>
        ${escapeHtml(p.name)}
      </h4>

      <div class="desc">
        ${escapeHtml(p.description || p.desc || '')}
      </div>


      <div class="sizes">

        ${
          (p.sizes || [])
            .map(
              (s,i) => `
                <span
                  class="size-opt ${i===0?'sel':''}"
                  data-size="${escapeAttr(s)}">
                  ${escapeHtml(s)}
                </span>
              `
            )
            .join('')
        }

      <button
        class="add-btn"
        data-add="${escapeAttr(p.id)}">

      </button>

    </div>

  </div>

  `;

}

/* =========================================================
   USER ORDERS
   ========================================================= */

function renderUserOrders(){

  if(!state.session){

    return `
      <div class="empty">
        سجل دخول الأول
      </div>
    `;

  }


  const userOrders =
    state.orders.filter(
      o =>
        String(o.user_email || o.userEmail || '')
          .toLowerCase() ===
        String(state.session.email || '')
          .toLowerCase()
    );


  if(!userOrders.length){

    return `
      <div class="empty">
        لسه مفيش طلبات
      </div>
    `;

  }


  return userOrders
    .slice()
    .reverse()
    .map(
      o=>orderCardHtml(o,false)
    )
    .join('');

}


/* =========================================================
   ORDER CARD
   ========================================================= */

function orderCardHtml(o,isAdminCard){

  const status =
    o.status || 'جديد';


  let statusClass =
    'new';

  if(
    status === 'تم التجهيز' ||
    status === 'preparing'
  ){

    statusClass =
      'preparing';

  }

  if(
    status === 'تم التسليم' ||
    status === 'delivered'
  ){

    statusClass =
      'delivered';

  }


  let items = [];

  if(Array.isArray(o.items)){

    items =
      o.items;

  }

  else if(typeof o.items === 'string'){

    try{

      items =
        JSON.parse(o.items);

    }catch(e){

      items = [];

    }

  }


  return `

  <div class="order-card">

    <div class="order-head">

      <div>

        <h4>
          طلب #${escapeHtml(o.id)}
        </h4>

        <div class="order-date">
          ${escapeHtml(
            o.order_date ||
            o.created_at ||
            ''
          )}
        </div>

      </div>


      <span class="status ${statusClass}">
        ${escapeHtml(status)}
      </span>

    </div>


    ${
      isAdminCard
      ?
      `
      <div
        style="background:var(--cream);padding:10px;border-radius:10px;margin-bottom:10px;font-size:12px;">

        <div>
          <strong>الاسم:</strong>
          ${escapeHtml(
            o.user_name ||
            o.userName ||
            ''
          )}
        </div>

        <div>
          <strong>الإيميل:</strong>
          ${escapeHtml(
            o.user_email ||
            o.userEmail ||
            ''
          )}
        </div>

        <div>
          <strong>الموبايل:</strong>
          ${escapeHtml(
            o.phone ||
            ''
          )}
        </div>

        <div>
          <strong>العنوان:</strong>
          ${escapeHtml(
            o.address ||
            ''
          )}
        </div>

      </div>
      `
      :
      ''
    }


    <div class="order-items">

      ${
        items.length
        ?
        items.map(
          item=>`

          <div class="order-item">

            <span>
              ${escapeHtml(
                item.name ||
                item.product_name ||
                ''
              )}

              ${
                item.size
                ?
                ` — ${escapeHtml(item.size)}`
                :
                ''
              }

              ×
              ${Number(item.qty || item.quantity || 1)}

            </span>

            <strong>
              ${Number(
                item.price ||
                0
              ) * Number(
                item.qty ||
                item.quantity ||
                1
              )} ج.م
            </strong>

          </div>

          `
        ).join('')
        :
        `<div class="meta">
          تفاصيل المنتجات غير متاحة
        </div>`
      }

    </div>


    <div class="order-total">

      <span>
        الإجمالي
      </span>

      <span>
        ${Number(o.total || 0)} ج.م
      </span>

    </div>


    ${
      isAdminCard
      ?
      `
      <div class="status-actions">

        <button
          data-status="${escapeAttr(o.id)}|جديد">
          جديد
        </button>

        <button
          data-status="${escapeAttr(o.id)}|تم التجهيز">
          تم التجهيز
        </button>

        <button
          data-status="${escapeAttr(o.id)}|تم التسليم">
          تم التسليم
        </button>

      </div>
      `
      :
      ''
    }

  </div>

  `;

}
